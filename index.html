<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사람 서랍</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#121317;
  --panel:#191b21;
  --panel-2:#20232b;
  --border:#2b2f3a;
  --text:#e8e9ee;
  --text-soft:#8b8f9c;
  --accent:#cf9d4f;
  --accent-soft:#cf9d4f22;
  --danger:#e0665a;
  --radius:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Pretendard', -apple-system, sans-serif;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
button,input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ---------- Top bar ---------- */
.topbar{
  display:flex; align-items:center; gap:14px; padding:0 20px; height:56px; flex:none;
  background:var(--panel); border-bottom:1px solid var(--border);
}
.topbar h1{font-size:1.05rem; font-weight:700; margin:0;}
.viewtabs{display:flex; gap:4px; margin-left:8px;}
.viewtab{background:transparent; border:none; color:var(--text-soft); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:.86rem; font-weight:500;}
.viewtab.active{background:var(--accent-soft); color:var(--accent);}
.addbtn{margin-left:auto; background:var(--accent); color:#181a20; border:none; border-radius:7px; padding:8px 14px; font-weight:600; font-size:.85rem; cursor:pointer;}

/* ---------- App body ---------- */
.appwrap{flex:1; display:flex; overflow:hidden;}
#profileView{display:none; flex:1; overflow:hidden;}
#profileView.active{display:flex;}
#vizView{display:none; flex:1; overflow:hidden; flex-direction:column;}
#vizView.active{display:flex;}

/* Sidebar */
.sidebar{width:230px; flex:none; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:16px;}
.sidebar h3{font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-soft); margin:18px 0 8px; font-weight:600;}
.sidebar h3:first-child{margin-top:0;}
.searchbox{display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--border); border-radius:7px; padding:7px 10px;}
.searchbox input{border:none;background:transparent;outline:none;flex:1;font-size:.85rem;color:var(--text);}
.chipwrap{display:flex; flex-wrap:wrap; gap:6px;}
.chip{border:1px solid var(--border); background:var(--panel-2); color:var(--text); border-radius:12px; padding:4px 10px; font-size:.78rem; cursor:pointer; user-select:none;}
.chip.selected{background:var(--accent); color:#181a20; border-color:var(--accent);}
.favtoggle{display:flex; align-items:center; gap:7px; font-size:.83rem; color:var(--text-soft); margin-top:6px;}
.stars-filter{color:var(--accent); cursor:pointer; margin-top:4px;}

/* List */
.listpane{flex:1; overflow-y:auto; min-width:280px;}
.listrow{display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid var(--border); cursor:pointer;}
.listrow:hover{background:var(--panel-2);}
.listrow.active{background:var(--accent-soft); border-left:2px solid var(--accent); padding-left:16px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.15rem;overflow:hidden;flex:none;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.listrow .info{flex:1; min-width:0;}
.listrow .name{font-size:.9rem; font-weight:600; display:flex; align-items:center; gap:5px;}
.listrow .meta{font-size:.74rem; color:var(--text-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.listrow .stars{font-size:.76rem; color:var(--accent); flex:none;}
.empty-msg{color:var(--text-soft); text-align:center; padding:60px 20px; font-size:.9rem;}

/* Detail panel */
.detailpane{width:420px; flex:none; background:var(--panel); border-left:1px solid var(--border); overflow-y:auto; padding:20px; display:none;}
.detailpane.open{display:block;}
.detailpane .dp-empty{color:var(--text-soft); text-align:center; padding:80px 20px; font-size:.86rem;}
.dp-header{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
.dp-avatar{width:56px;height:56px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.6rem;overflow:hidden;flex:none;position:relative;}
.dp-avatar img{width:100%;height:100%;object-fit:cover;}
.dp-name-input{font-size:1.05rem; font-weight:700; background:transparent; border:none; color:var(--text); outline:none; width:100%; padding:2px 0; border-bottom:1px solid transparent;}
.dp-name-input:focus{border-bottom:1px solid var(--accent);}
.filebtn{display:inline-block; font-size:.72rem; background:var(--panel-2); border:1px solid var(--border); color:var(--text-soft); border-radius:10px; padding:3px 8px; cursor:pointer; margin-top:4px;}
.filebtn input{display:none;}
.field{margin:14px 0;}
.field label{display:block; font-size:.72rem; color:var(--text-soft); margin-bottom:5px; font-weight:600;}
.field textarea, .field select, .field input[type=text]{
  width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:7px 9px; font-size:.85rem;
}
.field textarea{min-height:60px; resize:vertical;}
.manage-toggle{font-size:.72rem; color:var(--accent); cursor:pointer; margin-top:6px; display:inline-block;}
.manage-box{margin-top:8px; padding:10px; background:var(--panel-2); border:1px solid var(--border); border-radius:6px;}
.manage-row{display:flex; align-items:center; gap:6px; padding:4px 0;}
.manage-row input[type=text]{flex:1; font-size:.78rem; padding:4px 7px;}
.manage-row input[type=color]{width:24px;height:24px;padding:0;border:none;background:none;flex:none;}
.manage-row .x{cursor:pointer; color:var(--danger); font-size:.85rem; flex:none;}
.addrow{display:flex; gap:5px; margin-top:6px;}
.addrow input{flex:1; font-size:.78rem; padding:5px 8px; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:6px;}
.addrow button{border:none; background:var(--accent); color:#181a20; border-radius:6px; padding:5px 10px; font-size:.78rem; cursor:pointer; flex:none;}
.starpicker span{cursor:pointer; font-size:1.15rem; color:var(--accent);}
.favcheck{display:flex; align-items:center; gap:8px; font-size:.85rem;}
.rel-item{display:flex; align-items:center; gap:7px; padding:6px 0; border-bottom:1px dashed var(--border); font-size:.83rem;}
.rel-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.rel-item .who{font-weight:600;}
.rel-item .rtype{color:var(--text-soft); font-size:.72rem;}
.dp-actions{display:flex; justify-content:space-between; margin-top:22px; padding-top:14px; border-top:1px solid var(--border);}
.btn{border:none; border-radius:7px; padding:7px 14px; cursor:pointer; font-size:.82rem; font-weight:600;}
.btn.primary{background:var(--accent); color:#181a20;}
.btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text-soft);}
.btn.danger{background:transparent; border:1px solid var(--danger); color:var(--danger);}

/* Visualization view */
.vizbar{display:flex; align-items:center; gap:10px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap;}
.vizbar select{border-radius:7px; padding:6px 10px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-size:.82rem;}
.vizbar label{color:var(--text-soft); font-size:.8rem;}
.gearbtn{margin-left:auto; background:var(--panel-2); border:1px solid var(--border); color:var(--text-soft); border-radius:7px; padding:6px 10px; cursor:pointer; font-size:.8rem;}
.legend{display:flex; gap:12px; flex-wrap:wrap; padding:6px 20px; font-size:.75rem; color:var(--text-soft);}
.legend span{display:inline-flex; align-items:center; gap:5px;}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}
#graphcanvas{flex:1; width:100%; cursor:grab;}
.vizmanage{position:absolute; right:20px; top:100px; width:280px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; display:none; z-index:20;}
.vizmanage.open{display:block;}
.vizmanage h4{margin:10px 0 6px; font-size:.78rem; color:var(--text-soft);}
.vizmanage h4:first-child{margin-top:0;}
</style>
</head>
<body>

<div class="topbar">
  <h1>사람 서랍</h1>
  <div class="viewtabs">
    <button class="viewtab active" id="tabProfile">프로필</button>
    <button class="viewtab" id="tabViz">관계 시각화</button>
  </div>
  <button class="addbtn" id="addFriendBtn">+ 새 프로필</button>
</div>

<div class="appwrap">
  <div id="profileView" class="active">
    <div class="sidebar">
      <div class="searchbox">🔎<input id="searchInput" placeholder="이름 검색"></div>
      <h3>정렬</h3>
      <div class="chipwrap" id="sortChips">
        <span class="chip selected" data-sort="name">이름순</span>
        <span class="chip" data-sort="rating">별점순</span>
        <span class="chip" data-sort="recent">최근수정순</span>
      </div>
      <div class="favtoggle"><input type="checkbox" id="favOnly"><label for="favOnly">즐겨찾기만</label></div>
      <div class="stars-filter" id="minStarFilter"></div>
      <div id="dynamicFilters"></div>
    </div>
    <div class="listpane" id="listPane"></div>
    <div class="detailpane" id="detailPane"><div class="dp-empty">왼쪽에서 프로필을 선택하거나<br>"+ 새 프로필"로 시작하세요.</div></div>
  </div>

  <div id="vizView">
    <div class="vizbar">
      <label>무리 표현</label>
      <select id="groupModeSel">
        <option value="wedge">부채꼴 배경</option>
        <option value="ring">색상 링</option>
        <option value="none">표시 안 함</option>
      </select>
      <label>무리 필터</label>
      <select id="groupFilterSel"><option value="">전체</option></select>
      <button class="gearbtn" id="vizGearBtn">⚙ 색상/유형 관리</button>
    </div>
    <div class="legend" id="relLegend"></div>
    <canvas id="graphcanvas"></canvas>
    <div class="vizmanage" id="vizManage"></div>
  </div>
</div>

<script>
const SUPABASE_URL="https://hlvpffypajsoythbfrvb.supabase.co";
const SUPABASE_KEY="sb_publishable_lGroGfmZE91oueKBLlgerQ_Ja8Fwhmz";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let state={
  friends:[], tagTypes:[], tags:[], groups:[], relTypes:[], relationships:[],
  friendTags:[], friendGroups:[],
  filters:{search:"", tagIds:new Set(), favOnly:false, minStar:0, sort:"name"},
  selectedId:null, creating:false, pendingAvatarFile:null,
};

async function loadAll(preserveSelection=true){
  const [ft,tg,gp,rt,fr,frt,frg,rel]=await Promise.all([
    sb.from('tag_types').select('*').order('created_at'),
    sb.from('tags').select('*').order('created_at'),
    sb.from('groups').select('*').order('created_at'),
    sb.from('relationship_types').select('*').order('created_at'),
    sb.from('friends').select('*').order('name'),
    sb.from('friend_tags').select('*'),
    sb.from('friend_groups').select('*'),
    sb.from('friend_relationships').select('*'),
  ]);
  state.tagTypes=ft.data||[]; state.tags=tg.data||[]; state.groups=gp.data||[];
  state.relTypes=rt.data||[]; state.friends=fr.data||[]; state.friendTags=frt.data||[];
  state.friendGroups=frg.data||[]; state.relationships=rel.data||[];
  renderSidebarFilters(); renderList(); renderGroupFilterOptions();
  if(!preserveSelection) state.selectedId=null;
  renderDetail();
  if(document.getElementById('vizView').classList.contains('active')) drawGraph();
}
function subscribeRealtime(){
  sb.channel('public:all').on('postgres_changes',{event:'*',schema:'public'},()=>loadAll()).subscribe();
}

const tagsByType=(name)=>state.tags.filter(t=>{const tt=state.tagTypes.find(x=>x.id===t.tag_type_id); return tt&&tt.name===name;});
const friendTagIds=(fid)=>state.friendTags.filter(x=>x.friend_id===fid).map(x=>x.tag_id);
const friendGroupIds=(fid)=>state.friendGroups.filter(x=>x.friend_id===fid).map(x=>x.group_id);
const tagLabel=(id)=>(state.tags.find(t=>t.id===id)||{}).label||'';
const relTypeById=(id)=>state.relTypes.find(r=>r.id===id)||{label:'관계',color:'#999'};

// ---------------- Sidebar filters ----------------
function renderSidebarFilters(){
  const wrap=document.getElementById('dynamicFilters'); wrap.innerHTML='';
  state.tagTypes.forEach(tt=>{
    const box=document.createElement('div');
    const h=document.createElement('h3'); h.textContent=tt.name; box.appendChild(h);
    const cw=document.createElement('div'); cw.className='chipwrap';
    tagsByType(tt.name).forEach(tag=>{
      const chip=document.createElement('span');
      chip.className='chip'+(state.filters.tagIds.has(tag.id)?' selected':'');
      chip.textContent=tag.label;
      chip.onclick=()=>{ state.filters.tagIds.has(tag.id)?state.filters.tagIds.delete(tag.id):state.filters.tagIds.add(tag.id); renderSidebarFilters(); renderList(); };
      cw.appendChild(chip);
    });
    box.appendChild(cw); wrap.appendChild(box);
  });
  const ms=document.getElementById('minStarFilter'); ms.innerHTML='';
  for(let i=1;i<=5;i++){
    const s=document.createElement('span'); s.textContent=i<=state.filters.minStar?'★':'☆';
    s.onclick=()=>{ state.filters.minStar=(state.filters.minStar===i)?0:i; renderSidebarFilters(); renderList(); };
    ms.appendChild(s);
  }
}
document.getElementById('favOnly').onchange=e=>{state.filters.favOnly=e.target.checked; renderList();};
document.getElementById('searchInput').oninput=e=>{state.filters.search=e.target.value.trim(); renderList();};
document.querySelectorAll('#sortChips .chip').forEach(c=>{
  c.onclick=()=>{document.querySelectorAll('#sortChips .chip').forEach(x=>x.classList.remove('selected')); c.classList.add('selected'); state.filters.sort=c.dataset.sort; renderList();};
});

function friendMatchesFilters(f){
  if(state.filters.search && !f.name.toLowerCase().includes(state.filters.search.toLowerCase())) return false;
  if(state.filters.favOnly && !f.favorite) return false;
  if(state.filters.minStar && (f.rating||0)<state.filters.minStar) return false;
  if(state.filters.tagIds.size){
    const owned=new Set([...friendTagIds(f.id), f.category_tag_id].filter(Boolean));
    for(const tid of state.filters.tagIds) if(!owned.has(tid)) return false;
  }
  return true;
}

// ---------------- List ----------------
function renderList(){
  const pane=document.getElementById('listPane');
  let list=state.friends.filter(friendMatchesFilters);
  if(state.filters.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  else if(state.filters.sort==='rating') list.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(state.filters.sort==='recent') list.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
  if(!list.length){ pane.innerHTML='<div class="empty-msg">해당하는 프로필이 없어요.</div>'; return; }
  pane.innerHTML='';
  list.forEach(f=>{
    const row=document.createElement('div');
    row.className='listrow'+(state.selectedId===f.id?' active':'');
    const cat=f.category_tag_id?tagLabel(f.category_tag_id):'';
    const tagNames=friendTagIds(f.id).map(tagLabel).slice(0,4).join(', ');
    row.innerHTML=`
      <div class="avatar">${f.avatar_image_url?`<img src="${f.avatar_image_url}">`:(f.avatar_emoji||'🙂')}</div>
      <div class="info">
        <div class="name">${f.name} ${f.favorite?'⭐':''}</div>
        <div class="meta">${[cat,tagNames].filter(Boolean).join(' · ')||'-'}</div>
      </div>
      <div class="stars">${'★'.repeat(f.rating||0)}</div>
    `;
    row.onclick=()=>{ state.creating=false; state.selectedId=f.id; renderList(); renderDetail(); };
    pane.appendChild(row);
  });
}
function renderGroupFilterOptions(){
  const sel=document.getElementById('groupFilterSel'); const cur=sel.value;
  sel.innerHTML='<option value="">전체</option>'+state.groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
  sel.value=cur;
}

// ---------------- Detail panel ----------------
const detailPane=document.getElementById('detailPane');
document.getElementById('addFriendBtn').onclick=()=>{ state.creating=true; state.selectedId=null; state.pendingAvatarFile=null; renderDetail(); };

function renderDetail(){
  const f = state.creating ? null : state.friends.find(x=>x.id===state.selectedId);
  if(!f && !state.creating){ detailPane.classList.remove('open'); detailPane.innerHTML='<div class="dp-empty">왼쪽에서 프로필을 선택하거나<br>"+ 새 프로필"로 시작하세요.</div>'; return; }
  detailPane.classList.add('open');
  const isNew = state.creating;
  const catTags=tagsByType('분류');
  const otherTypes=state.tagTypes.filter(t=>t.name!=='분류');
  const myTagIds=f?new Set(friendTagIds(f.id)):new Set();
  const myGroupIds=f?new Set(friendGroupIds(f.id)):new Set();
  const myRels=f?state.relationships.filter(r=>r.friend_id===f.id||r.related_friend_id===f.id):[];

  detailPane.innerHTML=`
    <div class="dp-header">
      <div class="dp-avatar" id="dpAvatar">${f&&f.avatar_image_url?`<img src="${f.avatar_image_url}">`:(f?(f.avatar_emoji||'🙂'):'🙂')}</div>
      <div style="flex:1;">
        <input type="text" class="dp-name-input" id="f_name" placeholder="이름" value="${f?f.name:''}">
        <label class="filebtn">사진 업로드<input type="file" id="f_photofile" accept="image/*"></label>
      </div>
    </div>
    <div class="field"><label>이모지 (분류 선택 시 자동, 직접 수정 가능)</label><input type="text" id="f_emoji" value="${f?(f.avatar_emoji||''):''}" placeholder="😎"></div>

    <div class="field"><label>분류</label>
      <select id="f_category"><option value="">선택 안 함</option>${catTags.map(t=>`<option value="${t.id}" ${f&&f.category_tag_id===t.id?'selected':''}>${t.label}</option>`).join('')}</select>
      <span class="manage-toggle" data-manage="cat">선택지 편집</span>
      <div class="manage-box" id="manage_cat" style="display:none;">
        ${catTags.map(t=>`<div class="manage-row"><input type="text" value="${t.label}" data-tagid="${t.id}" data-field="label"><input type="text" style="width:44px;flex:none;" value="${t.default_emoji||''}" placeholder="이모지" data-tagid="${t.id}" data-field="default_emoji"><span class="x" data-deltag="${t.id}">✕</span></div>`).join('')}
        <div class="addrow"><input type="text" id="add_cat" placeholder="새 분류"><button data-addtag="분류">추가</button></div>
      </div>
    </div>

    ${otherTypes.map(tt=>`
      <div class="field"><label>${tt.name}</label>
        <div class="chipwrap" data-tagtype="${tt.id}">
          ${tagsByType(tt.name).map(tag=>`<span class="chip ${myTagIds.has(tag.id)?'selected':''}" data-tagid="${tag.id}">${tag.label}</span>`).join('')}
        </div>
        <span class="manage-toggle" data-manage="${tt.id}">선택지 편집</span>
        <div class="manage-box" id="manage_${tt.id}" style="display:none;">
          ${tagsByType(tt.name).map(t=>`<div class="manage-row"><input type="text" value="${t.label}" data-tagid="${t.id}" data-field="label"><span class="x" data-deltag="${t.id}">✕</span></div>`).join('')}
          <div class="addrow"><input type="text" id="add_${tt.id}" placeholder="새 ${tt.name}"><button data-addtag="${tt.id}">추가</button></div>
        </div>
      </div>
    `).join('')}

    <div class="field"><label>본문</label><textarea id="f_desc">${f?(f.description||''):''}</textarea></div>
    <div class="field"><label>관계(글)</label><textarea id="f_relnote">${f?(f.relationship_note||''):''}</textarea></div>

    <div class="field"><label>무리</label>
      <div class="chipwrap" id="f_groups">${state.groups.map(g=>`<span class="chip ${myGroupIds.has(g.id)?'selected':''}" data-gid="${g.id}" style="border-color:${g.color};">${g.name}</span>`).join('')}</div>
      <span class="manage-toggle" data-manage="groups">선택지 편집</span>
      <div class="manage-box" id="manage_groups" style="display:none;">
        ${state.groups.map(g=>`<div class="manage-row"><input type="color" value="${g.color}" data-gcolor="${g.id}"><input type="text" value="${g.name}" data-gname="${g.id}"><span class="x" data-delgroup="${g.id}">✕</span></div>`).join('')}
        <div class="addrow"><input type="text" id="add_group" placeholder="새 무리"><input type="color" id="add_group_color" value="#cf9d4f" style="width:26px;flex:none;padding:0;border:none;"><button id="btnAddGroup">추가</button></div>
      </div>
    </div>

    <div class="field"><label>기타사항</label><textarea id="f_etc">${f?(f.etc_note||''):''}</textarea></div>
    <div class="field favcheck"><input type="checkbox" id="f_fav" ${f&&f.favorite?'checked':''}><label for="f_fav">즐겨찾기</label></div>
    <div class="field"><label>별점</label><div class="starpicker" id="f_stars" data-value="${f?f.rating||0:0}">${[1,2,3,4,5].map(i=>`<span data-v="${i}">${(f&&f.rating>=i)?'★':'☆'}</span>`).join('')}</div></div>

    ${!isNew?`
    <div class="field"><label>인간관계</label>
      ${myRels.length?myRels.map(r=>{
        const otherId=r.friend_id===f.id?r.related_friend_id:r.friend_id;
        const other=state.friends.find(x=>x.id===otherId);
        const rt=relTypeById(r.relationship_type_id);
        return `<div class="rel-item"><span class="rel-dot" style="background:${rt.color}"></span><span class="who">${other?other.name:'(삭제됨)'}</span><span class="rtype">${rt.label} · 강도 ${r.strength}</span></div>`;
      }).join(''):'<div style="color:var(--text-soft);font-size:.82rem;">아직 없음</div>'}
      <div style="margin-top:8px;">
        <select id="rel_target">${state.friends.filter(x=>x.id!==f.id).map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>
        <select id="rel_type" style="margin-top:5px;">${state.relTypes.map(rt=>`<option value="${rt.id}">${rt.label}</option>`).join('')}</select>
        <div style="margin-top:5px;">강도 <input type="range" id="rel_strength" min="1" max="5" value="3"></div>
        <textarea id="rel_detail" placeholder="세부 설명"></textarea>
        <button class="btn ghost" style="margin-top:5px;" id="btnAddRel">관계 추가</button>
        <span class="manage-toggle" data-manage="reltypes">관계 유형 편집</span>
        <div class="manage-box" id="manage_reltypes" style="display:none;">
          ${state.relTypes.map(rt=>`<div class="manage-row"><input type="color" value="${rt.color}" data-rcolor="${rt.id}"><input type="text" value="${rt.label}" data-rname="${rt.id}"><span class="x" data-delrel="${rt.id}">✕</span></div>`).join('')}
          <div class="addrow"><input type="text" id="add_reltype" placeholder="새 관계 유형"><input type="color" id="add_reltype_color" value="#cf9d4f" style="width:26px;flex:none;padding:0;border:none;"><button id="btnAddRelType">추가</button></div>
        </div>
      </div>
    </div>`:''}

    <div class="dp-actions">
      ${!isNew?`<button class="btn danger" id="btnDelete">삭제</button>`:'<span></span>'}
      <button class="btn primary" id="btnSave">${isNew?'만들기':'저장'}</button>
    </div>
  `;

  // wire events
  detailPane.querySelectorAll('.chip[data-tagid]').forEach(c=>c.onclick=()=>c.classList.toggle('selected'));
  detailPane.querySelectorAll('#f_groups .chip').forEach(c=>c.onclick=()=>c.classList.toggle('selected'));
  detailPane.querySelectorAll('#f_stars span').forEach(s=>{
    s.onclick=()=>{ const v=+s.dataset.v; detailPane.querySelectorAll('#f_stars span').forEach(x=>x.textContent=(+x.dataset.v<=v)?'★':'☆'); detailPane.querySelector('#f_stars').dataset.value=v; };
  });
  detailPane.querySelectorAll('.manage-toggle').forEach(t=>{
    t.onclick=()=>{ const box=document.getElementById('manage_'+t.dataset.manage); box.style.display = box.style.display==='none'?'block':'none'; };
  });
  const photoInput=document.getElementById('f_photofile');
  if(photoInput) photoInput.onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    state.pendingAvatarFile=file;
    const reader=new FileReader();
    reader.onload=()=>{ document.getElementById('dpAvatar').innerHTML=`<img src="${reader.result}">`; };
    reader.readAsDataURL(file);
  };
  const catSel=document.getElementById('f_category');
  if(catSel) catSel.onchange=(e)=>{
    const tag=state.tags.find(t=>t.id===e.target.value);
    const emojiInput=document.getElementById('f_emoji');
    if(tag && tag.default_emoji && !emojiInput.value){ emojiInput.value=tag.default_emoji; }
  };

  // inline tag/group/reltype management
  detailPane.querySelectorAll('[data-addtag]').forEach(btn=>{
    btn.onclick=async()=>{
      const key=btn.dataset.addtag;
      const typeId = key==='분류' ? (state.tagTypes.find(t=>t.name==='분류')||{}).id : key;
      const inp=document.getElementById(key==='분류'?'add_cat':'add_'+key);
      if(!inp.value.trim()) return;
      await sb.from('tags').insert({tag_type_id:typeId, label:inp.value.trim()});
    };
  });
  detailPane.querySelectorAll('[data-deltag]').forEach(x=>{
    x.onclick=async()=>{ if(!confirm('이 선택지를 삭제할까요? 사용 중인 프로필에서도 제거됩니다.')) return; await sb.from('tags').delete().eq('id', x.dataset.deltag); };
  });
  detailPane.querySelectorAll('[data-field="label"]').forEach(inp=>{
    inp.onchange=async()=>{ await sb.from('tags').update({label:inp.value}).eq('id', inp.dataset.tagid); };
  });
  detailPane.querySelectorAll('[data-field="default_emoji"]').forEach(inp=>{
    inp.onchange=async()=>{ await sb.from('tags').update({default_emoji: inp.value||null}).eq('id', inp.dataset.tagid); };
  });
  const btnAddGroup=document.getElementById('btnAddGroup');
  if(btnAddGroup) btnAddGroup.onclick=async()=>{
    const name=document.getElementById('add_group').value.trim(); const color=document.getElementById('add_group_color').value;
    if(!name) return; await sb.from('groups').insert({name,color});
  };
  detailPane.querySelectorAll('[data-gname]').forEach(inp=>inp.onchange=async()=>{ await sb.from('groups').update({name:inp.value}).eq('id', inp.dataset.gname); });
  detailPane.querySelectorAll('[data-gcolor]').forEach(inp=>inp.onchange=async()=>{ await sb.from('groups').update({color:inp.value}).eq('id', inp.dataset.gcolor); });
  detailPane.querySelectorAll('[data-delgroup]').forEach(x=>x.onclick=async()=>{ if(!confirm('이 무리를 삭제할까요?')) return; await sb.from('groups').delete().eq('id', x.dataset.delgroup); });

  const btnAddRelType=document.getElementById('btnAddRelType');
  if(btnAddRelType) btnAddRelType.onclick=async()=>{
    const label=document.getElementById('add_reltype').value.trim(); const color=document.getElementById('add_reltype_color').value;
    if(!label) return; await sb.from('relationship_types').insert({label,color});
  };
  detailPane.querySelectorAll('[data-rname]').forEach(inp=>inp.onchange=async()=>{ await sb.from('relationship_types').update({label:inp.value}).eq('id', inp.dataset.rname); });
  detailPane.querySelectorAll('[data-rcolor]').forEach(inp=>inp.onchange=async()=>{ await sb.from('relationship_types').update({color:inp.value}).eq('id', inp.dataset.rcolor); });
  detailPane.querySelectorAll('[data-delrel]').forEach(x=>x.onclick=async()=>{ if(!confirm('이 관계 유형을 삭제할까요?')) return; await sb.from('relationship_types').delete().eq('id', x.dataset.delrel); });

  const btnAddRel=document.getElementById('btnAddRel');
  if(btnAddRel) btnAddRel.onclick=async()=>{
    const target=document.getElementById('rel_target').value, type=document.getElementById('rel_type').value;
    const strength=+document.getElementById('rel_strength').value, detail=document.getElementById('rel_detail').value;
    if(!target) return;
    await sb.from('friend_relationships').insert({friend_id:f.id, related_friend_id:target, relationship_type_id:type, strength, detail});
  };

  document.getElementById('btnSave').onclick=()=>saveFriend(f?f.id:null);
  const btnDelete=document.getElementById('btnDelete');
  if(btnDelete) btnDelete.onclick=()=>deleteFriend(f.id);
}

async function uploadAvatarIfNeeded(friendId){
  if(!state.pendingAvatarFile) return null;
  const file=state.pendingAvatarFile;
  const ext=(file.name.split('.').pop()||'jpg');
  const path=`${friendId}/${Date.now()}.${ext}`;
  const {error}=await sb.storage.from('avatars').upload(path, file, {upsert:true});
  if(error){ alert('사진 업로드 실패: '+error.message); return null; }
  const {data}=sb.storage.from('avatars').getPublicUrl(path);
  state.pendingAvatarFile=null;
  return data.publicUrl;
}

async function saveFriend(id){
  const name=document.getElementById('f_name').value.trim();
  if(!name){ alert('이름을 입력해주세요.'); return; }
  const payload={
    name,
    avatar_emoji: document.getElementById('f_emoji').value.trim()||null,
    category_tag_id: document.getElementById('f_category').value||null,
    description: document.getElementById('f_desc').value,
    relationship_note: document.getElementById('f_relnote').value,
    etc_note: document.getElementById('f_etc').value,
    favorite: document.getElementById('f_fav').checked,
    rating: +(detailPane.querySelector('#f_stars').dataset.value||0),
  };
  let friendId=id;
  if(id){ await sb.from('friends').update(payload).eq('id', id); }
  else { const {data}=await sb.from('friends').insert(payload).select().single(); friendId=data.id; }

  const uploadedUrl=await uploadAvatarIfNeeded(friendId);
  if(uploadedUrl) await sb.from('friends').update({avatar_image_url: uploadedUrl}).eq('id', friendId);

  const selectedTagIds=[...detailPane.querySelectorAll('.chipwrap[data-tagtype] .chip.selected')].map(c=>c.dataset.tagid);
  await sb.from('friend_tags').delete().eq('friend_id', friendId);
  if(selectedTagIds.length) await sb.from('friend_tags').insert(selectedTagIds.map(tid=>({friend_id:friendId, tag_id:tid})));

  const selectedGroupIds=[...detailPane.querySelectorAll('#f_groups .chip.selected')].map(c=>c.dataset.gid);
  await sb.from('friend_groups').delete().eq('friend_id', friendId);
  if(selectedGroupIds.length) await sb.from('friend_groups').insert(selectedGroupIds.map(gid=>({friend_id:friendId, group_id:gid})));

  state.creating=false; state.selectedId=friendId;
  await loadAll();
}
async function deleteFriend(id){
  if(!confirm('정말 삭제할까요? 관련 태그/무리/관계 기록도 함께 삭제됩니다.')) return;
  await sb.from('friends').delete().eq('id', id);
  state.selectedId=null;
  await loadAll();
}

// ---------------- View tabs ----------------
function setView(v){
  document.getElementById('profileView').classList.toggle('active', v==='profile');
  document.getElementById('vizView').classList.toggle('active', v==='viz');
  document.getElementById('tabProfile').classList.toggle('active', v==='profile');
  document.getElementById('tabViz').classList.toggle('active', v==='viz');
  document.getElementById('addFriendBtn').style.display = v==='profile'?'inline-block':'none';
  if(v==='viz'){ resizeCanvas(); drawGraph(); }
}
document.getElementById('tabProfile').onclick=()=>setView('profile');
document.getElementById('tabViz').onclick=()=>setView('viz');

// ---------------- Visualization ----------------
const canvas=document.getElementById('graphcanvas'), ctx=canvas.getContext('2d');
let nodes=[], hoveredId=null;
function resizeCanvas(){ canvas.width=canvas.clientWidth; canvas.height=canvas.clientHeight; }
window.addEventListener('resize', ()=>{ if(document.getElementById('vizView').classList.contains('active')) { resizeCanvas(); drawGraph(); } });
document.getElementById('groupModeSel').onchange=drawGraph;
document.getElementById('groupFilterSel').onchange=drawGraph;
document.getElementById('vizGearBtn').onclick=()=>{
  const box=document.getElementById('vizManage');
  box.classList.toggle('open');
  renderVizManage();
};
function renderVizManage(){
  const box=document.getElementById('vizManage');
  box.innerHTML=`
    <h4>무리 색상</h4>
    ${state.groups.map(g=>`<div class="manage-row"><input type="color" value="${g.color}" data-vgcolor="${g.id}"><input type="text" value="${g.name}" data-vgname="${g.id}"><span class="x" data-vgdel="${g.id}">✕</span></div>`).join('')}
    <div class="addrow"><input type="text" id="vg_add_name" placeholder="새 무리"><input type="color" id="vg_add_color" value="#cf9d4f" style="width:26px;flex:none;padding:0;border:none;"><button id="vg_add_btn">추가</button></div>
    <h4>관계 유형 색상</h4>
    ${state.relTypes.map(rt=>`<div class="manage-row"><input type="color" value="${rt.color}" data-vrcolor="${rt.id}"><input type="text" value="${rt.label}" data-vrname="${rt.id}"><span class="x" data-vrdel="${rt.id}">✕</span></div>`).join('')}
    <div class="addrow"><input type="text" id="vr_add_name" placeholder="새 관계 유형"><input type="color" id="vr_add_color" value="#cf9d4f" style="width:26px;flex:none;padding:0;border:none;"><button id="vr_add_btn">추가</button></div>
  `;
  box.querySelectorAll('[data-vgcolor]').forEach(i=>i.onchange=async()=>{await sb.from('groups').update({color:i.value}).eq('id',i.dataset.vgcolor);});
  box.querySelectorAll('[data-vgname]').forEach(i=>i.onchange=async()=>{await sb.from('groups').update({name:i.value}).eq('id',i.dataset.vgname);});
  box.querySelectorAll('[data-vgdel]').forEach(x=>x.onclick=async()=>{if(!confirm('삭제할까요?'))return; await sb.from('groups').delete().eq('id',x.dataset.vgdel);});
  const vgBtn=document.getElementById('vg_add_btn');
  if(vgBtn) vgBtn.onclick=async()=>{const n=document.getElementById('vg_add_name').value.trim(); if(!n)return; await sb.from('groups').insert({name:n,color:document.getElementById('vg_add_color').value});};
  box.querySelectorAll('[data-vrcolor]').forEach(i=>i.onchange=async()=>{await sb.from('relationship_types').update({color:i.value}).eq('id',i.dataset.vrcolor);});
  box.querySelectorAll('[data-vrname]').forEach(i=>i.onchange=async()=>{await sb.from('relationship_types').update({label:i.value}).eq('id',i.dataset.vrname);});
  box.querySelectorAll('[data-vrdel]').forEach(x=>x.onclick=async()=>{if(!confirm('삭제할까요?'))return; await sb.from('relationship_types').delete().eq('id',x.dataset.vrdel);});
  const vrBtn=document.getElementById('vr_add_btn');
  if(vrBtn) vrBtn.onclick=async()=>{const n=document.getElementById('vr_add_name').value.trim(); if(!n)return; await sb.from('relationship_types').insert({label:n,color:document.getElementById('vr_add_color').value});};
}

function layoutNodes(filterGroupId){
  let list=state.friends;
  if(filterGroupId) list=list.filter(f=>friendGroupIds(f.id).includes(filterGroupId));
  list=[...list].sort((a,b)=>{
    const ga=(friendGroupIds(a.id)[0]||''), gb=(friendGroupIds(b.id)[0]||'');
    if(ga!==gb) return ga.localeCompare(gb);
    return a.name.localeCompare(b.name,'ko');
  });
  const cx=canvas.width/2, cy=canvas.height/2, r=Math.min(cx,cy)-70, n=list.length||1;
  nodes=list.map((f,i)=>{ const angle=(i/n)*Math.PI*2-Math.PI/2; return {id:f.id, x:cx+r*Math.cos(angle), y:cy+r*Math.sin(angle)}; });
}
function edgesForGraph(){ const idset=new Set(nodes.map(n=>n.id)); return state.relationships.filter(r=>idset.has(r.friend_id)&&idset.has(r.related_friend_id)); }

function drawGraph(){
  if(!document.getElementById('vizView').classList.contains('active')) return;
  resizeCanvas();
  const filterGroupId=document.getElementById('groupFilterSel').value||null;
  const mode=document.getElementById('groupModeSel').value;
  layoutNodes(filterGroupId);
  const edges=edgesForGraph();
  document.getElementById('relLegend').innerHTML=state.relTypes.map(rt=>`<span><i style="background:${rt.color}"></i>${rt.label}</span>`).join('');

  cancelAnimationFrame(window.__vizraf);
  function frame(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const cx=canvas.width/2, cy=canvas.height/2;
    if(mode==='wedge' && nodes.length){
      const n=nodes.length;
      nodes.forEach((node,i)=>{
        const f=state.friends.find(x=>x.id===node.id); if(!f) return;
        const gid=friendGroupIds(f.id)[0]; const g=state.groups.find(x=>x.id===gid); if(!g) return;
        const a0=(i/n)*Math.PI*2-Math.PI/2-(Math.PI/n), a1=(i/n)*Math.PI*2-Math.PI/2+(Math.PI/n);
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,Math.min(cx,cy)-20,a0,a1); ctx.closePath();
        ctx.fillStyle=g.color+'14'; ctx.fill();
      });
    }
    edges.forEach(e=>{
      const a=nodes.find(x=>x.id===e.friend_id), b=nodes.find(x=>x.id===e.related_friend_id); if(!a||!b) return;
      const rt=relTypeById(e.relationship_type_id);
      const dim=hoveredId && hoveredId!==a.id && hoveredId!==b.id;
      const midx=(a.x+b.x)/2, midy=(a.y+b.y)/2, pull=0.35;
      const qx=midx+(cx-midx)*pull, qy=midy+(cy-midy)*pull;
      ctx.strokeStyle=rt.color; ctx.globalAlpha=dim?0.08:0.55; ctx.lineWidth=0.8+(e.strength||3)*0.7;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.quadraticCurveTo(qx,qy,b.x,b.y); ctx.stroke();
    });
    ctx.globalAlpha=1;
    nodes.forEach(n=>{
      const f=state.friends.find(x=>x.id===n.id); if(!f) return;
      const gIds=friendGroupIds(f.id);
      const dim=hoveredId && hoveredId!==n.id && !edges.some(e=>(e.friend_id===hoveredId&&e.related_friend_id===n.id)||(e.related_friend_id===hoveredId&&e.friend_id===n.id));
      ctx.globalAlpha=dim?0.25:1;
      if(mode==='ring' && gIds.length){
        gIds.forEach((gid,i)=>{ const g=state.groups.find(x=>x.id===gid); if(!g) return;
          ctx.beginPath(); ctx.arc(n.x,n.y,20+i*4,0,Math.PI*2); ctx.strokeStyle=g.color; ctx.lineWidth=2.2; ctx.stroke(); });
      }
      ctx.beginPath(); ctx.arc(n.x,n.y,16,0,Math.PI*2); ctx.fillStyle='#191b21'; ctx.fill();
      ctx.lineWidth=1.2; ctx.strokeStyle='#3a3f4d'; ctx.stroke();
      ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#e8e9ee'; ctx.fillText(f.avatar_emoji||'🙂', n.x, n.y-1);
      ctx.font='11px Pretendard, sans-serif'; ctx.fillStyle=hoveredId===n.id?'#cf9d4f':'#8b8f9c';
      ctx.fillText(f.name, n.x, n.y+28);
      ctx.globalAlpha=1;
    });
    window.__vizraf=requestAnimationFrame(frame);
  }
  frame();
}
canvas.addEventListener('mousemove', e=>{
  const r=canvas.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
  const n=nodes.find(n=>(n.x-mx)**2+(n.y-my)**2<18*18); hoveredId=n?n.id:null;
});
canvas.addEventListener('mouseleave', ()=>hoveredId=null);
canvas.addEventListener('click', e=>{
  const r=canvas.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
  const n=nodes.find(n=>(n.x-mx)**2+(n.y-my)**2<18*18);
  if(n){ setView('profile'); state.creating=false; state.selectedId=n.id; renderList(); renderDetail(); }
});

loadAll();
subscribeRealtime();
</script>
