<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>인간관계 분석</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#13151b; --bg2:#181b23; --panel:#1e2230; --panel2:#252a3a; --line:#2e3447;
  --text:#e8eaf2; --muted:#8d93a8; --accent:#6366f1; --accent2:#818cf8; --danger:#ef5d5d;
  --star:#e8b341; --ok:#4ade80;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --navh:64px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#333a50;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ===== header / nav ===== */
header{display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.logo{font-weight:800;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.logo b{color:var(--accent2)}
nav.top{display:flex;gap:3px}
.nav-btn{padding:8px 15px;border-radius:9px;color:var(--muted);font-weight:700;font-size:13.5px;transition:.15s}
.nav-btn:hover{color:var(--text);background:var(--panel)}
.nav-btn.on{color:var(--text);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.hd-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.conn-dot{width:8px;height:8px;border-radius:50%;background:#666;transition:.3s;flex-shrink:0}
.conn-dot.ok{background:var(--ok);box-shadow:0 0 8px #4ade8088}
.conn-dot.bad{background:var(--danger)}
.conn-label{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

nav.bottom{display:none}

.page{display:none;padding:20px;max-width:1300px;margin:0 auto}
.page.on{display:block}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:19px;font-weight:800}
.count{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--panel);padding:3px 9px;border-radius:20px;border:1px solid var(--line)}
.spacer{flex:1}
.empty-note{color:var(--muted);text-align:center;padding:40px 0;font-size:13.5px;line-height:1.8}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;font-weight:700;font-size:13px;background:var(--panel2);border:1px solid var(--line);transition:.15s;white-space:nowrap}
.btn:hover{border-color:#48506e;background:#2b3146}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.danger{color:#ffb4b4;border-color:#5a3340}
.btn.danger:hover{background:#3a2030;border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:7px}
.btn.ghost{background:transparent}
.icon-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent;font-size:13px;flex-shrink:0}
.icon-btn:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
.icon-btn.del:hover{color:var(--danger);border-color:#5a3340}
.search-input{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;font-size:13px;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}
select.search-input{cursor:pointer}
.color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:1px solid #0004}
.stars{font-size:12.5px;color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:#3a3f52}

/* ===== dashboard ===== */
.dash-section{margin-bottom:26px}
.dash-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.dash-head h3{font-size:14px;font-weight:800}
.dash-head .sub{font-size:11.5px;color:var(--muted)}
.dash-head .more{margin-left:auto;font-size:12px;color:var(--accent2);font-weight:700}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{height:6px}
.mini-card{flex:0 0 auto;width:132px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 12px;cursor:pointer;transition:.15s;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;position:relative}
.mini-card:hover{border-color:#4a5273;transform:translateY(-2px)}
.mini-card .av{width:44px;height:44px;border-radius:14px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:21px;overflow:hidden;border:1px solid var(--line)}
.mini-card .av img{width:100%;height:100%;object-fit:cover}
.mini-card .nm{font-weight:800;font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-card .sub{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-card .badge{position:absolute;top:8px;right:9px;font-size:10.5px;color:var(--star)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:24px}
.stat-box{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}
.stat-box .v{font-size:23px;font-weight:800;font-family:var(--mono);line-height:1.1}
.stat-box .k{font-size:11.5px;color:var(--muted);margin-top:4px}
.group-strip{display:flex;gap:8px;flex-wrap:wrap}
.group-pill{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.group-pill:hover{border-color:#4a5273}
.group-pill .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* list rows */
.row-list{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;transition:.15s}
.frow:hover{border-color:#4a5273}
.frow .av{width:38px;height:38px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
.frow .av img{width:100%;height:100%;object-fit:cover}
.frow .main{flex:1;min-width:0}
.frow .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
.frow .meta{font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.mini-tag{font-size:10.5px;padding:2px 7px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.fav-star{color:#454c66;font-size:15px}
.fav-star.on{color:var(--star)}

/* profile card grid (친구 목록) */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px 12px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;position:relative}
.pcard:hover{border-color:#4a5273;transform:translateY(-2px)}
.pcard .fav{position:absolute;top:10px;right:11px;color:var(--star);font-size:12.5px}
.pcard .av{width:58px;height:58px;border-radius:18px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden;border:1px solid var(--line)}
.pcard .av img{width:100%;height:100%;object-fit:cover}
.pcard .nm{font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sub{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}

/* filter bar */
.filterbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filterbar .search-input{flex:1;min-width:150px}
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px;width:265px;box-shadow:0 14px 34px #000b;z-index:40;display:none;max-height:330px;overflow-y:auto}
.pop.on{display:block}
.pop .sec{margin-bottom:12px}
.pop .sec:last-child{margin-bottom:0}
.pop .lbl{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin-bottom:7px}
.toggle-grid{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);transition:.13s;position:relative}
.pill:hover{border-color:#48506e;color:var(--text)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.wdel{padding-right:26px}
.pill .del{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;opacity:.45}
.pill .del:hover{opacity:1;background:#0005}

/* ===== graph ===== */
#graphWrap{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--bg2);overflow:hidden}
#graphSvg{width:100%;display:block;cursor:grab;touch-action:none}
#graphSvg:active{cursor:grabbing}
.graph-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chkbox{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chkbox.on{color:var(--text);border-color:var(--accent);background:#232842}
.chkbox input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.slider-ctl{display:inline-flex;align-items:center;gap:9px;padding:7px 13px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.slider-ctl input{width:90px;accent-color:var(--accent)}
.graph-legend{position:absolute;top:12px;left:12px;background:#181b23e8;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:11.5px;max-width:190px;max-height:calc(100% - 24px);overflow-y:auto}
.graph-legend .lg-title{font-weight:800;color:var(--muted);margin-bottom:5px;font-size:10px;letter-spacing:.07em}
.graph-legend .lg-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.graph-legend .lg-sec{margin-bottom:9px}
.graph-legend .lg-sec:last-child{margin-bottom:0}
.graph-info{position:absolute;bottom:12px;left:12px;right:12px;background:#181b23e8;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:12.5px;display:none}
.graph-info.on{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.graph-info .gi-name{font-weight:800;font-size:14px}
.node-label{font-size:11px;font-weight:700;fill:var(--text);pointer-events:none;paint-order:stroke;stroke:#13151b;stroke-width:3.5px}
.edge-label{font-size:9.5px;font-weight:700;fill:var(--muted);pointer-events:none;paint-order:stroke;stroke:#181b23;stroke-width:3px}

/* ===== modals ===== */
.overlay{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:17px;width:100%;max-width:560px;padding:22px;animation:pop .18s ease;box-shadow:0 20px 60px #000b}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.modal h2 .x{margin-left:auto}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field textarea,.field select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px;line-height:1.55}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal-foot .left{margin-right:auto}
.star-pick{display:flex;gap:5px;font-size:24px;color:#3a3f52;cursor:pointer}
.star-pick span.on{color:var(--star)}
.inline-add{display:flex;gap:6px;margin-top:8px}
.inline-add input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;outline:none;font-size:12.5px}
.inline-add input:focus{border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.55}

/* detail modal */
.detail-hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.detail-hero .av{width:56px;height:56px;border-radius:17px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden;border:1px solid var(--line);flex-shrink:0}
.detail-hero .av img{width:100%;height:100%;object-fit:cover}
.detail-hero .hname{font-size:20px;font-weight:800;display:flex;align-items:center;gap:9px}
.detail-hero .hsub{font-size:12px;color:var(--muted);margin-top:4px}
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}
.sbox .v{font-size:16px;font-weight:800;font-family:var(--mono)}
.sbox .k{font-size:10.5px;color:var(--muted);margin-top:3px}
.dtabs{display:flex;gap:4px;margin-bottom:16px;background:var(--panel);padding:4px;border-radius:11px}
.dtab{flex:1;padding:9px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.13s}
.dtab.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.dpanel{display:none}
.dpanel.on{display:block}
.dsec{margin-bottom:16px}
.dsec .sl{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.dsec .sl .ed{margin-left:auto;font-size:11px;color:var(--accent2);font-weight:700;letter-spacing:0}
.dsec p{font-size:13.5px;line-height:1.65;color:#d4d8e4;white-space:pre-wrap}
.dsec p.dim{color:var(--muted);font-size:12.5px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--panel2);border:1px solid var(--line)}
.rel-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);cursor:pointer;margin-bottom:7px}
.rel-item:hover{border-color:var(--accent)}
.rel-item .rt{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;flex-shrink:0}
.rel-item .rn{font-weight:700;font-size:13px}
.rel-item .rd{font-size:11.5px;color:var(--muted)}
.rel-item .dir{font-family:var(--mono);color:var(--muted);font-size:13px;flex-shrink:0}
.rel-edit{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:8px;position:relative}
.rel-edit .rr-del{position:absolute;top:8px;right:8px}
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;padding-right:32px}
.rel-grid2{display:grid;grid-template-columns:1fr 88px;gap:9px}
.rel-edit label{font-size:10px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.rel-edit select,.rel-edit input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:12.5px;outline:none}
.rel-edit select:focus,.rel-edit input:focus{border-color:var(--accent)}

/* settings */
.set-block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;margin-bottom:14px}
.set-block h3{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.color-row{display:flex;gap:7px;flex-wrap:wrap}
.color-sw{width:27px;height:27px;border-radius:9px;border:2px solid transparent;cursor:pointer}
.color-sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}

/* analysis */
.bar-list{display:flex;flex-direction:column;gap:9px}
.bar-item{display:flex;align-items:center;gap:11px;font-size:12.5px}
.bar-item .bl{width:92px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar-item .bt{flex:1;height:9px;background:var(--panel);border-radius:5px;overflow:hidden}
.bar-item .bf{height:100%;border-radius:5px;background:var(--accent)}
.bar-item .bv{width:34px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-shrink:0}

#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 19px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:0 8px 24px #000b}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--danger);color:#ffc2c2}

.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px #6366f188;z-index:60}
.fab:active{transform:scale(.94)}

@media (pointer:coarse){
  .icon-btn{width:38px;height:38px;font-size:15px}
  .search-input,.field input[type=text],.field textarea,.field select,.inline-add input{font-size:16px}
  .btn{padding:11px 17px}
}
@media(max-width:820px){
  header{padding:0 14px;height:52px}
  nav.top{display:none}
  .conn-label{display:none}
  nav.bottom{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:#181b23f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottom .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;border-radius:0;font-size:10.5px;font-weight:700}
  nav.bottom .nav-btn .ic{font-size:19px;line-height:1}
  nav.bottom .nav-btn.on{background:transparent;box-shadow:none;color:var(--accent2)}
  .page{padding:16px 14px calc(var(--navh) + 30px)}
  .fab{bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom));right:16px}
  #toast{bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom))}
  .summary-row{grid-template-columns:repeat(2,1fr)}
  .overlay{padding:16px 12px 40px}
  .graph-legend{max-width:132px;font-size:10.5px;padding:8px 10px}
  .rel-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="logo">인간관계<b>·</b>분석</div>
  <nav class="top">
    <button class="nav-btn on" data-page="friends">친구</button>
    <button class="nav-btn" data-page="graph">관계망</button>
    <button class="nav-btn" data-page="stats">분석</button>
    <button class="nav-btn" data-page="settings">설정</button>
  </nav>
  <div class="hd-right">
    <span class="conn-dot" id="connDot"></span>
    <span class="conn-label" id="connLabel">connecting…</span>
  </div>
</header>

<!-- ===== 친구 ===== -->
<section class="page on" id="page-friends">
  <div id="dashView">
    <div class="stat-row" id="dashStats"></div>
    <div id="dashSections"></div>
    <div class="dash-section">
      <div class="dash-head"><h3>전체 친구</h3><span class="count" id="allCount">0</span>
        <button class="more" id="toBrowse">검색·필터 →</button></div>
      <div class="card-grid" id="dashAllList"></div>
    </div>
  </div>

  <div id="browseView" style="display:none">
    <div class="page-head">
      <button class="btn ghost sm" id="backToDash">← 대시보드</button>
      <div class="spacer"></div>
      <span class="count" id="browseCount">0</span>
    </div>
    <div class="filterbar">
      <input type="text" class="search-input" id="qSearch" placeholder="이름 검색">
      <div class="pop-wrap">
        <button class="btn" id="btnFilter">필터<span id="filterBadge"></span></button>
        <div class="pop" id="filterPop"></div>
      </div>
      <select class="search-input" id="qSort">
        <option value="rating_desc">평점 높은순</option>

        <option value="rel_desc">관계 많은순</option>

        <option value="recent">최근 수정순</option>
      </select>
    </div>
    <div class="card-grid" id="browseList"></div>
  </div>
</section>

<!-- ===== 관계망 ===== -->
<section class="page" id="page-graph">
  <div class="page-head"><h2>관계망</h2><div class="spacer"></div>
    <span class="hint">노드 클릭 = 주변만 강조 · 더블클릭 = 상세</span>
  </div>
  <div class="graph-ctl">
    <select class="search-input" id="gFocus" style="min-width:150px"><option value="">중심 인물: 전체 보기</option></select>
    <select class="search-input" id="gDepth"><option value="1">1촌까지</option><option value="2">2촌까지</option><option value="99">전체 연결</option></select>
    <div class="pop-wrap">
      <button class="btn" id="gBtnFilter">필터<span id="gFilterBadge"></span></button>
      <div class="pop" id="gFilterPop"></div>
    </div>
    <label class="slider-ctl">최소 강도 <input type="range" id="gStrength" min="1" max="5" value="1"><span id="gStrengthVal" style="font-family:var(--mono)">1</span></label>
    <label class="chkbox" id="gLabelsBox"><input type="checkbox" id="gLabels">관계 라벨</label>
    <label class="chkbox on" id="gIsoBox"><input type="checkbox" id="gIso" checked>고립 숨기기</label>
    <label class="chkbox on" id="gInfoBox"><input type="checkbox" id="gInfoToggle" checked>정보창 표시</label>
    <button class="btn" id="gFit">전체 맞춤</button>
  </div>
  <div id="graphWrap">
    <svg id="graphSvg" height="620"></svg>
    <div class="graph-legend" id="graphLegend"></div>
    <div class="graph-info" id="graphInfo"></div>
  </div>
</section>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const SUPABASE_URL = 'https://hlvpffypajsoythbfrvb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lGroGfmZE91oueKBLlgerQ_Ja8Fwhmz';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORS = ['#6366f1','#e8b341','#4ade80','#60a5fa','#c084fc','#f472b6','#fb923c','#2dd4bf','#94a3b8','#e06c6c'];
const TAG_KINDS = ['특징','관심분야','성격','키워드'];

const S = {
  tagTypes:[], groups:[], relTypes:[], friends:[], relations:[],
  page:'friends', browse:false,
  filterTags:new Set(), filterGroups:new Set(), filterFav:false,
  detailId:null, dTab:0, dDraft:null, dRelDraft:[],
  quickCat:null,
  gFilterGroups:new Set(), gFilterTypes:new Set(), gFoldGroups:new Set(), gHideInfo:false,
  gSelected:null, gSim:null, gZoom:null, gSvgG:null,
  colorCtx:null, colorPick:COLORS[0],
  recent: JSON.parse(localStorage.getItem('fa_recent')||'[]'),
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(m, err=false){ const t=$('#toast'); t.textContent=m; t.className=err?'on err':'on'; clearTimeout(t._tm); t._tm=setTimeout(()=>t.className='',2200); }
function openOv(id){ $('#'+id).classList.add('on'); }
function closeOv(id){ $('#'+id).classList.remove('on'); }
$$('[data-close]').forEach(b=>b.addEventListener('click',()=>closeOv(b.dataset.close)));
$$('.overlay').forEach(ov=>ov.addEventListener('mousedown',e=>{ if(e.target===ov) ov.classList.remove('on'); }));
function starsHtml(r){ let h=''; for(let i=1;i<=5;i++) h+=`<span class="${i<=r?'':'off'}">★</span>`; return h; }
function tagType(n){ return S.tagTypes.find(t=>t.name===n); }
function friendById(id){ return S.friends.find(f=>f.id===id); }
function relCount(f){ return f.relOut.length + f.relIn.length; }
function avatarHtml(f){ return f.avatar_image_url ? `<img src="${esc(f.avatar_image_url)}">` : esc(f.avatar_emoji||'🙂'); }
function nextColor(existing){ const used=new Set((existing||[]).map(x=>x.color).filter(Boolean)); for(const c of COLORS) if(!used.has(c)) return c; return COLORS[(existing||[]).length % COLORS.length]; }

/* ---------- nav ---------- */
function gotoPage(p){
  S.page = p;
  $$('.nav-btn').forEach(b=>b.classList.toggle('on', b.dataset.page===p));
  $$('.page').forEach(s=>s.classList.toggle('on', s.id==='page-'+p));
  $('#fabAdd').style.display = (p==='friends') ? '' : 'none';
  try{ localStorage.setItem('fa_page', p); }catch(e){}
  if(p==='graph') renderGraph();
  if(p==='stats') renderStats();
}
$$('.nav-btn').forEach(b=>b.addEventListener('click',()=>gotoPage(b.dataset.page)));

/* ---------- load ---------- */
async function loadAll(){
  try{
    const [tt,gr,rt,fr,rl] = await Promise.all([
      sb.from('tag_types').select('*, tags(*)').order('name'),
      sb.from('groups').select('*').order('name'),
      sb.from('relationship_types').select('*').order('label'),
      sb.from('friends').select(`*, category:tags!category_tag_id(*), friend_tags(tags(*, tag_types(id,name))), friend_groups(groups(*))`).order('name'),
      sb.from('friend_relationships').select(`*, type:relationship_types(*), from:friends!friend_id(id,name), to:friends!related_friend_id(id,name)`),
    ]);
    for(const r of [tt,gr,rt,fr,rl]) if(r.error) throw r.error;
    S.tagTypes = (tt.data||[]).map(t=>({...t, tags:(t.tags||[]).sort((a,b)=>a.label.localeCompare(b.label))}));
    S.groups = gr.data||[]; S.relTypes = rt.data||[]; S.relations = rl.data||[];
    S.friends = (fr.data||[]).map(p=>{
      const tagsByType={};
      for(const l of (p.friend_tags||[])){ const tg=l.tags; if(!tg) continue; const n=tg.tag_types?.name; if(!n) continue; (tagsByType[n]=tagsByType[n]||[]).push(tg); }
      return {...p, tagsByType, groups:(p.friend_groups||[]).map(l=>l.groups).filter(Boolean),
        relOut:S.relations.filter(r=>r.friend_id===p.id), relIn:S.relations.filter(r=>r.related_friend_id===p.id)};
    });
    $('#connDot').className='conn-dot ok'; $('#connLabel').textContent='연결됨';
    renderAll();
  }catch(e){
    console.error(e);
    $('#connDot').className='conn-dot bad'; $('#connLabel').textContent='연결 오류';
    toast('데이터 로드 실패: '+(e.message||e), true);
  }
}
let rtTm=null;
sb.channel('fa_rt').on('postgres_changes',{event:'*',schema:'public'},()=>{ clearTimeout(rtTm); rtTm=setTimeout(loadAll,450); }).subscribe();

function renderAll(){
  renderDash(); renderFilterPop(); renderBrowse();
  renderSettings(); renderGraphControls();
  if(S.page==='graph') renderGraph();
  if(S.page==='stats') renderStats();
}

/* ---------- dashboard ---------- */
function pushRecent(id){
  S.recent = [id, ...S.recent.filter(x=>x!==id)].slice(0,12);
  try{ localStorage.setItem('fa_recent', JSON.stringify(S.recent)); }catch(e){}
}
function miniCard(f, sub, badge){
  return `<div class="mini-card" onclick="openDetail('${f.id}')">
    ${badge?`<span class="badge">${badge}</span>`:''}
    <div class="av">${avatarHtml(f)}</div>
    <div class="nm">${esc(f.name)}</div>
    <div class="sub">${esc(sub||'')}</div>
  </div>`;
}
function frow(f){
  const tags = TAG_KINDS.flatMap(k=>f.tagsByType[k]||[]).slice(0,3);
  const meta = [f.category?.label, f.groups.map(g=>g.name).join('·'), relCount(f)?`관계 ${relCount(f)}`:''].filter(Boolean).join(' · ');
  return `<div class="frow" onclick="openDetail('${f.id}')">
    <div class="av">${avatarHtml(f)}</div>
    <div class="main">
      <div class="nm">${esc(f.name)} ${f.favorite?'<span class="fav-star on" style="font-size:12px">★</span>':''}</div>
      <div class="meta">${esc(meta||'정보 없음')}</div>
    </div>
    <div class="right">
      <span class="stars">${starsHtml(f.rating||0)}</span>
      <div style="display:flex;gap:4px">${tags.map(t=>`<span class="mini-tag">${esc(t.label)}</span>`).join('')}</div>
    </div>
  </div>`;
}
function pcard(f){
  const tags = TAG_KINDS.flatMap(k=>f.tagsByType[k]||[]).slice(0,3);
  const meta = [f.category?.label, f.groups.map(g=>g.name).join('·')].filter(Boolean).join(' · ');
  return `<div class="pcard" onclick="openDetail('${f.id}')">
    ${f.favorite?'<span class="fav">★</span>':''}
    <div class="av">${avatarHtml(f)}</div>
    <div class="nm">${esc(f.name)}</div>
    <div class="stars">${starsHtml(f.rating||0)}</div>
    <div class="sub">${esc(meta||'정보 없음')}</div>
    ${tags.length?`<div class="tags">${tags.map(t=>`<span class="mini-tag">${esc(t.label)}</span>`).join('')}</div>`:''}
  </div>`;
}
function renderDash(){
  const F = S.friends;
  const totalRel = S.relations.length;
  const avg = F.length ? (F.reduce((a,b)=>a+(b.rating||0),0)/F.length).toFixed(1) : '0.0';
  $('#dashStats').innerHTML = `
    <div class="stat-box"><div class="v">${F.length}</div><div class="k">전체 친구</div></div>
    <div class="stat-box"><div class="v">${totalRel}</div><div class="k">등록된 관계</div></div>
    <div class="stat-box"><div class="v">${S.groups.length}</div><div class="k">무리</div></div>
    <div class="stat-box"><div class="v">${avg}</div><div class="k">평균 별점</div></div>`;

  const secs = [];
  const recent = S.recent.map(id=>friendById(id)).filter(Boolean);
  if(recent.length) secs.push({t:'최근 본 사람', s:'', items:recent.map(f=>miniCard(f, f.category?.label||''))});

  const favs = F.filter(f=>f.favorite);
  if(favs.length) secs.push({t:'즐겨찾기', s:`${favs.length}명`, items:favs.map(f=>miniCard(f, `★${f.rating||0}`, '★'))});

  const strong = F.map(f=>({f, n:relCount(f)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
  if(strong.length) secs.push({t:'관계가 많은 사람', s:'연결 수 기준', items:strong.map(x=>miniCard(x.f, `관계 ${x.n}개`))});

  const noted = F.filter(f=>f.description||f.relationship_note||f.etc_note);
  if(noted.length) secs.push({t:'메모가 있는 사람', s:`${noted.length}명`, items:noted.slice(0,10).map(f=>miniCard(f, (f.description||f.relationship_note||f.etc_note).slice(0,14)))});

  let html = secs.map(sec=>`<div class="dash-section">
    <div class="dash-head"><h3>${esc(sec.t)}</h3>${sec.s?`<span class="sub">${esc(sec.s)}</span>`:''}</div>
    <div class="hscroll">${sec.items.join('')}</div></div>`).join('');

  if(S.groups.length){
    html += `<div class="dash-section"><div class="dash-head"><h3>무리</h3><span class="sub">클릭하면 해당 무리만 보기</span></div>
      <div class="group-strip">${S.groups.map(g=>{
        const n = F.filter(f=>f.groups.some(x=>x.id===g.id)).length;
        return `<button class="group-pill" onclick="browseByGroup('${g.id}')"><span class="color-dot" style="background:${esc(g.color||'#666')}"></span>${esc(g.name)}<span class="n">${n}</span></button>`;
      }).join('')}</div></div>`;
  }
  $('#dashSections').innerHTML = html;

  $('#allCount').textContent = F.length;
  $('#dashAllList').innerHTML = F.length ? F.slice(0,12).map(pcard).join('')
    : `<div class="empty-note">아직 등록된 친구가 없습니다.<br>오른쪽 아래 ＋ 버튼으로 시작하세요.</div>`;
}
window.browseByGroup = gid => { S.filterGroups = new Set([gid]); renderFilterPop(); showBrowse(true); renderBrowse(); };
function showBrowse(on){ S.browse=on; $('#dashView').style.display=on?'none':''; $('#browseView').style.display=on?'':'none'; }
$('#toBrowse').addEventListener('click',()=>{ showBrowse(true); renderBrowse(); });
$('#backToDash').addEventListener('click',()=>{ showBrowse(false); renderDash(); });

/* ---------- browse / filters ---------- */
function renderFilterPop(){
  const pop = $('#filterPop');
  let html = `<div class="sec"><div class="lbl">즐겨찾기</div><div class="toggle-grid">
    <button class="pill ${S.filterFav?'on':''}" data-fav="1">★ 즐겨찾기만</button></div></div>`;
  if(S.groups.length) html += `<div class="sec"><div class="lbl">무리</div><div class="toggle-grid">
    ${S.groups.map(g=>`<button class="pill ${S.filterGroups.has(g.id)?'on':''}" data-gid="${g.id}"><span class="color-dot" style="background:${esc(g.color||'#666')}"></span>${esc(g.name)}</button>`).join('')}</div></div>`;
  for(const k of ['분류',...TAG_KINDS]){
    const tt = tagType(k); if(!tt||!tt.tags.length) continue;
    html += `<div class="sec"><div class="lbl">${esc(k)}</div><div class="toggle-grid">
      ${tt.tags.map(t=>`<button class="pill ${S.filterTags.has(t.id)?'on':''}" data-tid="${t.id}">${esc(t.label)}</button>`).join('')}</div></div>`;
  }
  pop.innerHTML = html;
  pop.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>{ S.filterFav=!S.filterFav; renderFilterPop(); renderBrowse(); }));
  pop.querySelectorAll('[data-gid]').forEach(b=>b.addEventListener('click',()=>{ const i=b.dataset.gid; S.filterGroups.has(i)?S.filterGroups.delete(i):S.filterGroups.add(i); renderFilterPop(); renderBrowse(); }));
  pop.querySelectorAll('[data-tid]').forEach(b=>b.addEventListener('click',()=>{ const i=b.dataset.tid; S.filterTags.has(i)?S.filterTags.delete(i):S.filterTags.add(i); renderFilterPop(); renderBrowse(); }));
  const n = S.filterTags.size + S.filterGroups.size + (S.filterFav?1:0);
  $('#filterBadge').textContent = n?` (${n})`:'';
}
$('#btnFilter').addEventListener('click',e=>{ e.stopPropagation(); $('#filterPop').classList.toggle('on'); });
$('#gBtnFilter').addEventListener('click',e=>{ e.stopPropagation(); $('#gFilterPop').classList.toggle('on'); });
document.addEventListener('click',e=>{ if(!e.target.closest('.pop-wrap')) $$('.pop').forEach(p=>p.classList.remove('on')); });

function renderBrowse(){
  const q = $('#qSearch').value.trim().toLowerCase();
  let rows = S.friends.filter(f=>{
    if(q && !f.name.toLowerCase().includes(q)) return false;
    if(S.filterFav && !f.favorite) return false;
    if(S.filterGroups.size && !f.groups.some(g=>S.filterGroups.has(g.id))) return false;
    if(S.filterTags.size){
      const ids = new Set([...Object.values(f.tagsByType).flat().map(t=>t.id), f.category_tag_id].filter(Boolean));
      for(const t of S.filterTags) if(!ids.has(t)) return false;
    }
    return true;
  });
  const s = $('#qSort').value;
  rows.sort((a,b)=>{
    if(s==='rating_desc') return (b.rating||0)-(a.rating||0);
    if(s==='rating_asc') return (a.rating||0)-(b.rating||0);
    if(s==='rel_desc') return relCount(b)-relCount(a);
    if(s==='name') return a.name.localeCompare(b.name);
    if(s==='recent') return new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at);
    return 0;
  });
  $('#browseCount').textContent = `${rows.length} / ${S.friends.length}`;
  $('#browseList').innerHTML = rows.length ? rows.map(pcard).join('') : `<div class="empty-note">조건에 맞는 친구가 없습니다.</div>`;
}

function bindPicker(gridId, kind, mode){
  const grid = $('#'+gridId); if(!grid) return;
  const d = S.dDraft;
  grid.querySelectorAll('.pill').forEach(b=>b.addEventListener('click',e=>{
    if(e.target.closest('[data-del]')) return;

    renderDetail();
  }));
  grid.querySelectorAll('[data-del]').forEach(x=>x.addEventListener('click',async e=>{
    e.stopPropagation();

    const id=x.dataset.del;
    const tbl = mode==='group'?'groups':'tags';
    const {error}=await sb.from(tbl).delete().eq('id',id);
    if(error) return toast('삭제 실패: '+error.message,true);
    if(mode==='cat'){ const tt=tagType('분류'); tt.tags=tt.tags.filter(t=>t.id!==id); if(d.category_tag_id===id) d.category_tag_id=null; }
    else if(mode==='tag'){ const tt=tagType(kind); tt.tags=tt.tags.filter(t=>t.id!==id); d.tags[kind].delete(id); }
    else { S.groups=S.groups.filter(g=>g.id!==id); d.groups.delete(id); }
    toast('삭제됨'); renderDetail();
  }));
  const addBtn = document.querySelector(`[data-add="${gridId}"]`);
  if(addBtn) addBtn.addEventListener('click',async()=>{
    const inp=$('#'+gridId+'-new'); const label=inp.value.trim(); if(!label) return;
    if(mode==='group'){
      const color=nextColor(S.groups);
      const {data,error}=await sb.from('groups').insert({name:label,color}).select().single();
      if(error) return toast('추가 실패: '+error.message,true);
      S.groups.push(data); d.groups.add(data.id);
    }else{
      const tn = mode==='cat'?'분류':kind;
      const tt=tagType(tn); if(!tt) return toast('태그 유형 없음: '+tn,true);
      const {data,error}=await sb.from('tags').insert({tag_type_id:tt.id,label}).select().single();
      if(error) return toast('추가 실패: '+error.message,true);
      tt.tags.push(data); tt.tags.sort((a,b)=>a.label.localeCompare(b.label));
      if(mode==='cat') d.category_tag_id=data.id; else d.tags[kind].add(data.id);
    }
    toast('추가 및 선택됨'); renderDetail();
  });
}

function renderGraph(){
  const svg=d3.select('#graphSvg'), wrap=$('#graphWrap');
  const w=wrap.clientWidth, h=Math.min(660, Math.max(420, window.innerHeight-260));
  svg.attr('height',h).attr('viewBox',[0,0,w,h]);
  svg.selectAll('*').remove();
  $('#graphInfo').className='graph-info';

  const minStr=Number($('#gStrength').value);
  const focusId=$('#gFocus').value;
  const depth=Number($('#gDepth').value);
  const showLabels=$('#gLabels').checked;
  const hideIso=$('#gIso').checked;

  let links = S.relations.filter(r=>(r.strength||3)>=minStr)
    .filter(r=>!S.gFilterTypes.size || S.gFilterTypes.has(r.relationship_type_id));
  let pool = S.friends.filter(f=>!S.gFilterGroups.size || f.groups.some(g=>S.gFilterGroups.has(g.id)));
  let ids = new Set(pool.map(f=>f.id));
  links = links.filter(r=>ids.has(r.friend_id)&&ids.has(r.related_friend_id));

  if(focusId && ids.has(focusId)){
    const adj={}; links.forEach(r=>{ (adj[r.friend_id]=adj[r.friend_id]||[]).push(r.related_friend_id); (adj[r.related_friend_id]=adj[r.related_friend_id]||[]).push(r.friend_id); });
    const seen=new Set([focusId]); let frontier=[focusId];
    for(let d=0;d<depth&&frontier.length;d++){
      const nxt=[];
      frontier.forEach(x=>(adj[x]||[]).forEach(y=>{ if(!seen.has(y)){ seen.add(y); nxt.push(y); } }));
      frontier=nxt;
    }
    ids=seen; pool=pool.filter(f=>ids.has(f.id));
    links=links.filter(r=>ids.has(r.friend_id)&&ids.has(r.related_friend_id));
  }
  if(hideIso){
    const conn=new Set(); links.forEach(r=>{ conn.add(r.friend_id); conn.add(r.related_friend_id); });
    if(focusId) conn.add(focusId);
    pool=pool.filter(f=>conn.has(f.id));
  }

  if(!pool.length){
    svg.append('text').attr('x',w/2).attr('y',h/2).attr('text-anchor','middle').attr('fill','#8d93a8')
      .text(S.friends.length?'조건에 맞는 노드가 없습니다':'등록된 친구가 없습니다');
    renderGraphLegend(); return;
  }

  const poolIds = new Set(pool.map(f=>f.id));
  const foldOf = {};
  pool.forEach(f=>{
    const fg = f.groups.find(g=>S.gFoldGroups.has(g.id));
    if(fg) foldOf[f.id] = 'folder:'+fg.id;
  });
  const folderMembers = {};
  pool.forEach(f=>{ const fid=foldOf[f.id]; if(fid) (folderMembers[fid]=folderMembers[fid]||[]).push(f); });
  const nodeMap = {};
  pool.forEach(f=>{ if(!foldOf[f.id]) nodeMap[f.id]={id:f.id, name:f.name, emoji:f.avatar_emoji||'🙂', groups:f.groups, color:f.groups[0]?.color||'#5b6178', deg:0, fav:f.favorite, rating:f.rating||0, isFolder:false}; });
  Object.entries(folderMembers).forEach(([fid,members])=>{
    const gid=fid.slice(7); const g=S.groups.find(x=>x.id===gid);
    nodeMap[fid]={id:fid, name:`${g?g.name:'무리'} (${members.length}명)`, emoji:'📁', groups:g?[g]:[], color:g?.color||'#5b6178', deg:0, fav:false, rating:0, isFolder:true, members};
  });
  const nodes = Object.values(nodeMap);
  const nodeIds=new Set(nodes.map(n=>n.id));

  const edgeMap={};
  links.filter(r=>poolIds.has(r.friend_id)&&poolIds.has(r.related_friend_id)).forEach(r=>{
    const s=foldOf[r.friend_id]||r.friend_id, t=foldOf[r.related_friend_id]||r.related_friend_id;
    if(s===t || !nodeIds.has(s) || !nodeIds.has(t)) return;
    const key=s+'→'+t, lbl=r.type?.label||'';
    if(!edgeMap[key]) edgeMap[key]={source:s, target:t, color:r.type?.color||'#7a8197', labels:new Set(lbl?[lbl]:[]), strength:r.strength||3, detail:r.detail||'', n:1};
    else { const e=edgeMap[key]; e.n++; e.strength=Math.max(e.strength,r.strength||3); if(lbl) e.labels.add(lbl); }
  });
  const edges = Object.values(edgeMap).map(e=>({...e, label:[...e.labels].join('·')+(e.n>1?` ×${e.n}`:'')}));
  const degMap={}; edges.forEach(e=>{ degMap[e.source]=(degMap[e.source]||0)+1; degMap[e.target]=(degMap[e.target]||0)+1; });
  nodes.forEach(n=>n.deg=degMap[n.id]||0);

  const defs=svg.append('defs');
  [...new Set(edges.map(e=>e.color))].forEach((c,i)=>{
    defs.append('marker').attr('id','arr'+i).attr('viewBox','0 -5 10 10').attr('refX',26).attr('refY',0)
      .attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
      .append('path').attr('d','M0,-5L10,0L0,5').attr('fill',c);
  });
  const colorIdx=Object.fromEntries([...new Set(edges.map(e=>e.color))].map((c,i)=>[c,i]));

  const g=svg.append('g'); S.gSvgG=g;
  S.gZoom=d3.zoom().scaleExtent([0.25,3]).on('zoom',ev=>g.attr('transform',ev.transform));
  svg.call(S.gZoom).on('dblclick.zoom',null);

  if(S.gSim) S.gSim.stop();
  S.gSim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(edges).id(d=>d.id).distance(d=>130-d.strength*8).strength(0.45))
    .force('charge',d3.forceManyBody().strength(-330))
    .force('center',d3.forceCenter(w/2,h/2))
    .force('collide',d3.forceCollide(d=>26+d.deg*1.5));

  const link=g.append('g').selectAll('line').data(edges).join('line')
    .attr('stroke',d=>d.color).attr('stroke-width',d=>1+d.strength*0.85)
    .attr('stroke-opacity',.72).attr('marker-end',d=>`url(#arr${colorIdx[d.color]})`);

  const elabel=g.append('g').selectAll('text').data(edges).join('text')
    .attr('class','edge-label').attr('text-anchor','middle')
    .style('display',showLabels?'':'none').text(d=>d.label);

  const node=g.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer')
    .call(d3.drag()
      .on('start',(ev,d)=>{ if(!ev.active) S.gSim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',(ev,d)=>{ d.fx=ev.x; d.fy=ev.y; })
      .on('end',(ev,d)=>{ if(!ev.active) S.gSim.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on('click',(ev,d)=>{ ev.stopPropagation(); S.gSelected = S.gSelected===d.id?null:d.id; applyHighlight(); })
    .on('dblclick',(ev,d)=>{ ev.stopPropagation(); if(d.isFolder){ const gid=d.id.slice(7); S.gFoldGroups.delete(gid); renderGraphControls(); renderGraph(); } else openDetail(d.id); });

  node.each(function(d){
    const sel=d3.select(this);
    const r=19+Math.min(9,d.deg*1.4);
    if(d.groups.length>1){
      const arc=d3.arc().innerRadius(r+2.5).outerRadius(r+6);
      const pie=d3.pie().value(1).sort(null)(d.groups);
      sel.selectAll('path.ring').data(pie).join('path').attr('class','ring')
        .attr('d',arc).attr('fill',x=>x.data.color||'#5b6178');
    }
    sel.append('circle').attr('r',r).attr('fill','#1e2230')
      .attr('stroke',d.color).attr('stroke-width',d.groups.length>1?2:(d.isFolder?4:3))
      .attr('stroke-dasharray',d.isFolder?'4,2':null);
    sel.append('text').attr('text-anchor','middle').attr('dy','.34em').attr('font-size',(r*0.85)+'px').text(d.emoji);
    sel.append('text').attr('class','node-label').attr('text-anchor','middle').attr('dy',r+15)
      .text(d.name + (d.fav?' ★':''));
  });

  svg.on('click',()=>{ S.gSelected=null; applyHighlight(); });

  function applyHighlight(){
    const sel=S.gSelected;
    if(!sel){
      node.style('opacity',1); link.style('opacity',.72); elabel.style('opacity',1);
      $('#graphInfo').className='graph-info';
      return;
    }
    const near=new Set([sel]);
    edges.forEach(e=>{ const s=e.source.id||e.source, t=e.target.id||e.target;
      if(s===sel) near.add(t); if(t===sel) near.add(s); });
    node.style('opacity',d=>near.has(d.id)?1:.13);
    link.style('opacity',d=>{ const s=d.source.id||d.source, t=d.target.id||d.target;
      return (s===sel||t===sel)?.95:.05; });
    elabel.style('opacity',d=>{ const s=d.source.id||d.source, t=d.target.id||d.target;
      return (s===sel||t===sel)?1:.05; });
    if(S.gHideInfo){ $('#graphInfo').className='graph-info'; return; }
    const conn=edges.filter(e=>{ const s=e.source.id||e.source,t=e.target.id||e.target; return s===sel||t===sel; });
    const nd = nodeMap[sel];
    $('#graphInfo').className='graph-info on';
    if(nd && nd.isFolder){
      $('#graphInfo').innerHTML = `<span class="gi-name">📁 ${esc(nd.name)}</span>
        <span style="color:var(--muted)">연결 ${conn.length}개 · 폴더 안 ${nd.members.length}명</span>
        <button class="btn sm primary" style="margin-left:auto" onclick="unfoldGroup('${sel.slice(7)}')">펼치기</button>`;
    }else{
      const f=friendById(sel);
      $('#graphInfo').innerHTML = `<span class="gi-name">${esc(f.name)}</span>
        <span class="stars">${starsHtml(f.rating||0)}</span>
        <span style="color:var(--muted)">연결 ${conn.length}개 · ${esc(f.groups.map(g=>g.name).join(', ')||'무리 없음')}</span>
        <button class="btn sm primary" style="margin-left:auto" onclick="openDetail('${sel}')">상세 보기</button>
        <button class="btn sm" onclick="setFocus('${sel}')">중심으로</button>`;
    }
  }
  window.setFocus = id => { $('#gFocus').value=id; S.gSelected=null; renderGraph(); };
  window.unfoldGroup = gid => { S.gFoldGroups.delete(gid); renderGraphControls(); renderGraph(); };

  S.gSim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    elabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-3);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
  renderGraphLegend();
  applyHighlight();
}
function renderGraphLegend(){
  $('#graphLegend').innerHTML = `
    <div class="lg-sec"><div class="lg-title">관계유형 (선)</div>
      ${S.relTypes.length?S.relTypes.map(t=>`<div class="lg-row"><span class="color-dot" style="background:${esc(t.color||'#666')}"></span>${esc(t.label)}</div>`).join(''):'<div style="color:var(--muted)">없음</div>'}</div>
    <div class="lg-sec"><div class="lg-title">무리 (테두리)</div>
      ${S.groups.length?S.groups.map(g=>`<div class="lg-row"><span class="color-dot" style="background:${esc(g.color||'#666')}"></span>${esc(g.name)}</div>`).join(''):'<div style="color:var(--muted)">없음</div>'}</div>
    <div class="lg-sec"><div class="lg-title">읽는 법</div>
      <div style="color:var(--muted);line-height:1.5">원 크기 = 연결 수<br>선 굵기 = 관계 강도<br>화살표 = 관계 방향<br>📁 점선 원 = 접힌 무리 폴더</div></div>`;
}
window.addEventListener('resize',()=>{ if(S.page==='graph') renderGraph(); });

/* ---------- 분석 ---------- */
function barList(items, color){
  const max=Math.max(1,...items.map(i=>i.v));
  return `<div class="bar-list">${items.map(i=>`<div class="bar-item">
    <span class="bl">${esc(i.k)}</span>
    <span class="bt"><span class="bf" style="width:${i.v/max*100}%;background:${i.color||color||'var(--accent)'}"></span></span>
    <span class="bv">${i.v}</span></div>`).join('')}</div>`;
}
function renderStats(){
  const F=S.friends;
  if(!F.length){ $('#statsBody').innerHTML='<div class="empty-note">분석할 데이터가 없습니다.</div>'; return; }
  const iso=F.filter(f=>relCount(f)===0);
  const top=F.map(f=>({k:f.name,v:relCount(f)})).filter(x=>x.v).sort((a,b)=>b.v-a.v).slice(0,8);
  const byGroup=S.groups.map(g=>({k:g.name,v:F.filter(f=>f.groups.some(x=>x.id===g.id)).length,color:g.color}));
  const byType=S.relTypes.map(t=>({k:t.label,v:S.relations.filter(r=>r.relationship_type_id===t.id).length,color:t.color}));
  const tagFreq={};
  F.forEach(f=>TAG_KINDS.forEach(k=>(f.tagsByType[k]||[]).forEach(t=>tagFreq[t.label]=(tagFreq[t.label]||0)+1)));
  const topTags=Object.entries(tagFreq).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v).slice(0,8);
  const density = F.length>1 ? (S.relations.length/(F.length*(F.length-1)/2)*100).toFixed(1) : '0.0';

  $('#statsBody').innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="v">${(S.relations.length/F.length).toFixed(1)}</div><div class="k">1인당 평균 관계</div></div>
      <div class="stat-box"><div class="v">${density}%</div><div class="k">관계망 밀도</div></div>
      <div class="stat-box"><div class="v">${iso.length}</div><div class="k">고립된 사람</div></div>
      <div class="stat-box"><div class="v">${F.filter(f=>f.favorite).length}</div><div class="k">즐겨찾기</div></div>
    </div>
    ${top.length?`<div class="set-block"><h3>관계가 많은 사람</h3>${barList(top)}</div>`:''}
    ${byGroup.length?`<div class="set-block"><h3>무리별 인원</h3>${barList(byGroup)}</div>`:''}
    ${byType.length?`<div class="set-block"><h3>관계유형 분포</h3>${barList(byType)}</div>`:''}
    ${topTags.length?`<div class="set-block"><h3>자주 쓰인 태그</h3>${barList(topTags)}</div>`:''}
    ${iso.length?`<div class="set-block"><h3>아직 관계가 없는 사람 <span class="count">${iso.length}</span></h3>
      <div class="chip-row">${iso.map(f=>`<span class="chip" style="cursor:pointer" onclick="openDetail('${f.id}')">${esc(f.name)}</span>`).join('')}</div></div>`:''}`;
}

/* ---------- 설정 ---------- */
function renderSettings(){
  $('#setTags').innerHTML = S.tagTypes.map(tt=>`
    <div class="set-block">
      <h3>${esc(tt.name)} <span class="count">${tt.tags.length}</span></h3>
      <div class="toggle-grid" id="st-${esc(tt.name)}">
        ${tt.tags.length?tt.tags.map(t=>`<span class="pill wdel">${esc(t.label)}<span class="del" data-st-del="${t.id}">✕</span></span>`).join(''):'<span class="hint">없음</span>'}
      </div>
      <div class="inline-add"><input type="text" id="st-new-${esc(tt.name)}" placeholder="새 ${esc(tt.name)} 추가"><button class="btn sm" data-st-add="${tt.id}" data-st-name="${esc(tt.name)}">추가</button></div>
    </div>`).join('');
  $('#setTags').querySelectorAll('[data-st-del]').forEach(x=>x.addEventListener('click',async()=>{
    if(!confirm('삭제할까요? 모든 친구에게서 사라집니다.')) return;
    const {error}=await sb.from('tags').delete().eq('id',x.dataset.stDel);
    if(error) return toast('삭제 실패: '+error.message,true);
    toast('삭제됨'); loadAll();
  }));
  $('#setTags').querySelectorAll('[data-st-add]').forEach(b=>b.addEventListener('click',async()=>{
    const inp=$('#st-new-'+b.dataset.stName); const label=inp.value.trim(); if(!label) return;
    const {error}=await sb.from('tags').insert({tag_type_id:b.dataset.stAdd,label});
    if(error) return toast('추가 실패: '+error.message,true);
    inp.value=''; toast('추가됨'); loadAll();
  }));

  $('#setGroupCount').textContent=S.groups.length;
  $('#setGroupGrid').innerHTML = S.groups.length?S.groups.map(g=>`
    <span class="pill wdel" style="cursor:pointer" data-gedit="${g.id}"><span class="color-dot" style="background:${esc(g.color||'#666')}"></span>${esc(g.name)}<span class="del" data-gdel="${g.id}">✕</span></span>`).join('')
    :'<span class="hint">없음</span>';
  $('#setGroupGrid').querySelectorAll('[data-gdel]').forEach(x=>x.addEventListener('click',async e=>{
    e.stopPropagation();
    if(!confirm('삭제할까요?')) return;
    const {error}=await sb.from('groups').delete().eq('id',x.dataset.gdel);
    if(error) return toast('삭제 실패: '+error.message,true);
    toast('삭제됨'); loadAll();
  }));
  $('#setGroupGrid').querySelectorAll('[data-gedit]').forEach(p=>p.addEventListener('click',e=>{
    if(e.target.closest('[data-gdel]')) return;
    openColorModal('groups', S.groups.find(g=>g.id===p.dataset.gedit), 'name');
  }));

  $('#setRelCount').textContent=S.relTypes.length;
  $('#setRelGrid').innerHTML = S.relTypes.length?S.relTypes.map(t=>`
    <span class="pill wdel" style="cursor:pointer" data-redit="${t.id}"><span class="color-dot" style="background:${esc(t.color||'#666')}"></span>${esc(t.label)}<span class="del" data-rdel="${t.id}">✕</span></span>`).join('')
    :'<span class="hint">없음</span>';
  $('#setRelGrid').querySelectorAll('[data-rdel]').forEach(x=>x.addEventListener('click',async e=>{
    e.stopPropagation();
    if(!confirm('삭제할까요? 이 유형의 관계도 사라집니다.')) return;
    const {error}=await sb.from('relationship_types').delete().eq('id',x.dataset.rdel);
    if(error) return toast('삭제 실패: '+error.message,true);
    toast('삭제됨'); loadAll();
  }));
  $('#setRelGrid').querySelectorAll('[data-redit]').forEach(p=>p.addEventListener('click',e=>{
    if(e.target.closest('[data-rdel]')) return;
    openColorModal('relationship_types', S.relTypes.find(t=>t.id===p.dataset.redit), 'label');
  }));
}
$('#setGroupAdd').addEventListener('click',async()=>{
  const name=$('#setGroupNew').value.trim(); if(!name) return;
  const {error}=await sb.from('groups').insert({name,color:nextColor(S.groups)});
  if(error) return toast('추가 실패: '+error.message,true);
  $('#setGroupNew').value=''; toast('추가됨'); loadAll();
});
$('#setRelAdd').addEventListener('click',async()=>{
  const label=$('#setRelNew').value.trim(); if(!label) return;
  const {error}=await sb.from('relationship_types').insert({label,color:nextColor(S.relTypes)});
  if(error) return toast('추가 실패: '+error.message,true);
  $('#setRelNew').value=''; toast('추가됨'); loadAll();
});
function openColorModal(table,row,nameField){
  if(!row) return;
  S.colorCtx={table,row,nameField};
  S.colorPick=row.color||COLORS[0];
  $('#colorName').value=row[nameField]||'';
  renderColorRow();
  openOv('ovColor');
}
function renderColorRow(){
  $('#colorRow').innerHTML=COLORS.map(c=>`<div class="color-sw ${c===S.colorPick?'on':''}" style="background:${c}" data-c="${c}"></div>`).join('');
  $('#colorRow').querySelectorAll('.color-sw').forEach(sw=>sw.addEventListener('click',()=>{ S.colorPick=sw.dataset.c; renderColorRow(); }));
}
$('#colorSave').addEventListener('click',async()=>{
  const {table,row,nameField}=S.colorCtx;
  const name=$('#colorName').value.trim(); if(!name) return toast('이름을 입력하세요',true);
  const {error}=await sb.from(table).update({[nameField]:name,color:S.colorPick}).eq('id',row.id);
  if(error) return toast('저장 실패: '+error.message,true);
  closeOv('ovColor'); toast('저장됨'); loadAll();
});

/* ---------- init ---------- */
try{ const p=localStorage.getItem('fa_page'); if(p) gotoPage(p); }catch(e){}
loadAll();
</script>
</body>
</html>
