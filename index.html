<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인간관계 분석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0F1115;
  --bg-elevated:#15181E;
  --card:#1A1D23;
  --card-border:#262A32;
  --text:#E8E9ED;
  --text-dim:#8A8F98;
  --text-faint:#565B66;
  --accent:#5B8CFF;
  --accent-dim:#5B8CFF33;
  --accent2:#2ED9C3;
  --accent2-dim:#2ED9C333;
  --gold:#F2B93B;
  --danger:#FF5C5C;
  --radius:14px;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --font-display:'Manrope',sans-serif;
  --font-body:'Inter',sans-serif;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F4F7;
    --bg-elevated:#FFFFFF;
    --card:#FFFFFF;
    --card-border:#E3E5EA;
    --text:#1B1D22;
    --text-dim:#666B75;
    --text-faint:#9A9EA8;
    --shadow:0 8px 24px rgba(20,22,30,.10);
  }
}
:root[data-theme="light"]{
  --bg:#F3F4F7;--bg-elevated:#FFFFFF;--card:#FFFFFF;--card-border:#E3E5EA;
  --text:#1B1D22;--text-dim:#666B75;--text-faint:#9A9EA8;--shadow:0 8px 24px rgba(20,22,30,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  min-height:100vh; overflow-x:hidden;
}
h1,h2,h3,.brand,.card-name,.section-title{font-family:var(--font-display);}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}

/* ---- Topbar ---- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:12px;
  padding:14px 20px; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--card-border);
}
.icon-btn{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--card-border);
  background:var(--card); color:var(--text); display:flex;align-items:center;justify-content:center;
  font-size:18px; flex:none; transition:.15s;
}
.icon-btn:hover{border-color:var(--accent); color:var(--accent);}
.brand{font-weight:800; font-size:18px; letter-spacing:-.02em; margin-right:4px; white-space:nowrap;}
.search-wrap{flex:1; position:relative; min-width:120px;}
.search-wrap input{
  width:100%; padding:10px 14px 10px 38px; border-radius:10px; border:1px solid var(--card-border);
  background:var(--card); color:var(--text); font-size:14px; outline:none;
}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap::before{content:"⌕"; position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:16px;}
.view-toggle{display:flex; background:var(--card); border:1px solid var(--card-border); border-radius:10px; overflow:hidden; flex:none;}
.view-toggle button{
  padding:9px 14px; border:none; background:transparent; color:var(--text-dim); font-size:13px; font-weight:600;
}
.view-toggle button.active{background:var(--accent); color:#fff;}
.add-btn{
  background:var(--accent); color:#fff; border:none; border-radius:10px; padding:0 16px; height:40px;
  font-weight:700; font-size:14px; flex:none; display:flex; align-items:center; gap:6px;
}
.add-btn:hover{filter:brightness(1.08);}

/* ---- Layout ---- */
.layout{display:flex;}
.drawer{
  width:280px; flex:none; background:var(--bg-elevated); border-right:1px solid var(--card-border);
  height:calc(100vh - 69px); position:sticky; top:69px; overflow-y:auto; padding:18px 16px;
  transform:translateX(-100%); transition:transform .22s ease; position:fixed; z-index:19; left:0;
}
.drawer.open{transform:translateX(0);}
.drawer-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:18; display:none;}
.drawer-backdrop.open{display:block;}
.filter-group{margin-bottom:20px;}
.filter-group h4{margin:0 0 10px; font-size:12px; text-transform:none; color:var(--text-dim); font-weight:700; letter-spacing:.02em;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.chip{
  padding:6px 11px; border-radius:999px; border:1px solid var(--card-border); background:var(--card);
  font-size:12.5px; color:var(--text-dim); user-select:none; transition:.15s;
}
.chip.selected{background:var(--accent2-dim); border-color:var(--accent2); color:var(--accent2);}
.chip:hover{border-color:var(--accent);}
select.plain, input.plain{
  width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--card-border); background:var(--card);
  color:var(--text); font-size:13px;
}
.star-mini{cursor:pointer; font-size:16px; color:var(--text-faint);}
.star-mini.on{color:var(--gold);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--text-dim);}
.reset-link{font-size:12px; color:var(--accent); background:none; border:none; padding:0; text-decoration:underline;}

.main{flex:1; padding:24px; min-width:0;}
.empty-state{text-align:center; padding:80px 20px; color:var(--text-faint);}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px;
}
.fcard{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:.15s; position:relative; box-shadow:var(--shadow);
}
.fcard:hover{border-color:var(--accent); transform:translateY(-2px);}
.fcard .fav{position:absolute; top:12px; right:12px; color:var(--accent); font-size:15px;}
.fcard .avatar{
  width:52px;height:52px;border-radius:14px; background:var(--bg-elevated); display:flex;align-items:center;justify-content:center;
  font-size:26px; margin-bottom:12px; overflow:hidden; border:1px solid var(--card-border);
}
.fcard .avatar img{width:100%;height:100%;object-fit:cover;}
.card-name{font-weight:700; font-size:15px; margin:0 0 4px;}
.card-cat{font-size:12px; color:var(--accent2); margin:0 0 8px;}
.card-stars{font-size:12px; color:var(--gold); letter-spacing:1px; margin-bottom:8px;}
.card-tags{display:flex; flex-wrap:wrap; gap:4px;}
.card-tags span{font-size:10.5px; padding:2px 7px; border-radius:999px; background:var(--bg-elevated); color:var(--text-dim);}

/* ---- Modal ---- */
.modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:40; padding:20px;}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--bg-elevated); border:1px solid var(--card-border); border-radius:18px; width:100%; max-width:560px;
  max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);
}
.modal-head{display:flex; align-items:center; gap:14px; padding:20px 22px; border-bottom:1px solid var(--card-border); position:sticky; top:0; background:var(--bg-elevated); z-index:2;}
.modal-head .avatar-lg{width:56px;height:56px;border-radius:16px; background:var(--card); display:flex;align-items:center;justify-content:center; font-size:28px; border:1px solid var(--card-border); overflow:hidden;}
.modal-head .avatar-lg img{width:100%;height:100%;object-fit:cover;}
.modal-head input.name-input{font-family:var(--font-display); font-weight:800; font-size:19px; background:none; border:none; color:var(--text); width:100%; outline:none; border-bottom:1px dashed transparent;}
.modal-head input.name-input:focus{border-color:var(--accent);}
.modal-body{padding:20px 22px;}
.field{margin-bottom:18px;}
.field label{display:block; font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:7px;}
.field textarea{width:100%; min-height:64px; padding:10px 12px; border-radius:10px; border:1px solid var(--card-border); background:var(--card); color:var(--text); font-size:13.5px; resize:vertical; outline:none;}
.field textarea:focus{border-color:var(--accent);}
.tagpicker{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
.tagpicker .chip{cursor:pointer;}
.addtag-inline{display:flex; gap:6px; margin-top:8px;}
.addtag-inline input{flex:1; padding:6px 9px; border-radius:8px; border:1px dashed var(--card-border); background:transparent; color:var(--text); font-size:12.5px;}
.addtag-inline button{padding:6px 10px; border-radius:8px; border:none; background:var(--accent2-dim); color:var(--accent2); font-size:12px; font-weight:700;}
.star-picker{font-size:22px; color:var(--text-faint); display:flex; gap:3px;}
.star-picker span{cursor:pointer;}
.star-picker span.on{color:var(--gold);}
.rel-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
.rel-item{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:8px 10px; font-size:12.5px;}
.rel-item .dot{width:8px;height:8px;border-radius:50%; flex:none;}
.rel-item .rname{font-weight:700; flex:1;}
.rel-item .rdetail{color:var(--text-dim); font-size:11.5px;}
.rel-item .rm{color:var(--danger); border:none; background:none; font-size:14px;}
.rel-add{display:grid; grid-template-columns:1fr 1fr auto; gap:6px; margin-bottom:6px;}
.rel-add input.detail{grid-column:1/3;}
.modal-foot{display:flex; gap:10px; padding:16px 22px; border-top:1px solid var(--card-border); position:sticky; bottom:0; background:var(--bg-elevated);}
.btn{padding:10px 16px; border-radius:10px; border:none; font-weight:700; font-size:13.5px; flex:1;}
.btn-primary{background:var(--accent); color:#fff;}
.btn-ghost{background:var(--card); color:var(--text-dim); border:1px solid var(--card-border); flex:none;}
.btn-danger{background:none; color:var(--danger); border:1px solid var(--danger); flex:none;}
.fav-toggle{margin-left:auto; font-size:20px; background:none; border:none; color:var(--text-faint); flex:none;}
.fav-toggle.on{color:var(--accent);}

/* ---- Graph ---- */
.graph-wrap{padding:0; position:relative;}
#graphCanvas{width:100%; height:calc(100vh - 69px); display:block; background:var(--bg);}
.graph-legend{position:absolute; top:16px; left:16px; background:var(--bg-elevated); border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; font-size:12px; max-width:200px;}
.graph-legend .row{display:flex; align-items:center; gap:7px; margin:5px 0;}
.graph-legend .dot{width:9px;height:9px;border-radius:50%;flex:none;}
.graph-hint{position:absolute; bottom:16px; left:16px; font-size:11.5px; color:var(--text-faint);}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--card-border); color:var(--text); padding:10px 18px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); z-index:60; opacity:0; transition:.2s;}
.toast.show{opacity:1;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--card-border); border-radius:8px;}
@media (max-width:640px){
  .brand{display:none;}
  .drawer{width:82vw;}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="hamburgerBtn" title="필터">☰</button>
  <div class="brand">인간관계 분석</div>
  <div class="search-wrap"><input id="searchInput" placeholder="이름으로 검색"></div>
  <div class="view-toggle">
    <button id="gridViewBtn" class="active">목록</button>
    <button id="graphViewBtn">관계도</button>
  </div>
  <button class="add-btn" id="addFriendBtn">＋ 추가</button>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer">
  <div class="filter-group">
    <h4>정렬</h4>
    <select class="plain" id="sortSelect">
      <option value="name">이름순</option>
      <option value="rating">별점 높은순</option>
      <option value="updated">최근 수정순</option>
    </select>
  </div>
  <div class="filter-group">
    <h4>분류</h4>
    <select class="plain" id="categoryFilter"><option value="">전체</option></select>
  </div>
  <div class="filter-group">
    <h4>무리</h4>
    <div class="chip-row" id="groupFilterRow"></div>
  </div>
  <div class="filter-group" id="tagFilterGroups"></div>
  <div class="filter-group">
    <h4>최소 별점</h4>
    <div class="star-picker" id="minRatingStars">
      <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
    </div>
  </div>
  <div class="filter-group toggle-row">
    <span>즐겨찾기만</span>
    <input type="checkbox" id="favOnlyCheck">
  </div>
  <button class="reset-link" id="resetFiltersBtn">필터 초기화</button>
</aside>

<div class="layout">
  <div class="main" id="gridView">
    <div class="grid" id="cardGrid"></div>
    <div class="empty-state hidden" id="emptyState">조건에 맞는 사람이 없어요.</div>
  </div>
  <div class="graph-wrap hidden" id="graphView" style="flex:1;">
    <canvas id="graphCanvas"></canvas>
    <div class="graph-legend" id="graphLegend"></div>
    <div class="graph-hint">드래그로 이동 · 클릭하면 카드가 열려요</div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="avatar-lg" id="modalAvatar">🙂</div>
      <input class="name-input" id="modalName" placeholder="이름">
      <button class="fav-toggle" id="modalFav">♥</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>분류</label>
        <select class="plain" id="modalCategory"></select>
      </div>
      <div class="field">
        <label>별점</label>
        <div class="star-picker" id="modalStars"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div>
      </div>
      <div id="tagFieldsContainer"></div>
      <div class="field">
        <label>무리</label>
        <div class="tagpicker" id="modalGroups"></div>
        <div class="addtag-inline"><input id="newGroupInput" placeholder="새 무리 이름"><button id="addGroupBtn">추가</button></div>
      </div>
      <div class="field">
        <label>본문</label>
        <textarea id="modalDesc" placeholder="이 사람에 대한 설명"></textarea>
      </div>
      <div class="field">
        <label>관계 (글)</label>
        <textarea id="modalRelNote" placeholder="관계에 대한 서술"></textarea>
      </div>
      <div class="field">
        <label>인간관계</label>
        <div class="rel-list" id="relList"></div>
        <div class="rel-add">
          <select class="plain" id="relFriendSelect"></select>
          <select class="plain" id="relTypeSelect"></select>
          <input class="plain detail" id="relDetailInput" placeholder="관계 설명 (선택)">
        </div>
        <div class="addtag-inline"><input id="newRelTypeInput" placeholder="새 관계 유형"><button id="addRelTypeBtn">유형 추가</button><button id="addRelBtn" style="background:var(--accent-dim);color:var(--accent);">관계 추가</button></div>
      </div>
      <div class="field">
        <label>기타사항</label>
        <textarea id="modalEtc" placeholder="기타 메모"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger hidden" id="deleteFriendBtn">삭제</button>
      <button class="btn btn-ghost" id="closeModalBtn">닫기</button>
      <button class="btn btn-primary" id="saveFriendBtn">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://hlvpffypajsoythbfrvb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lGroGfmZE91oueKBLlgerQ_Ja8Fwhmz';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let db = { tagTypes:[], tags:[], groups:[], relTypes:[], friends:[], friendTags:[], friendGroups:[], friendRels:[] };
let filters = { search:'', category:'', tagIds:new Set(), groupIds:new Set(), minRating:0, favOnly:false };
let sortMode = 'name';
let editingId = null; // null = new
let modalTagSelections = {}; // tagTypeId -> Set of tagIds
let modalGroupSelections = new Set();
let graphState = { nodes:[], edges:[], raf:null, dragging:null, offsetX:0, offsetY:0 };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200);
}

async function loadAll(){
  try{
    const [tt, tg, gr, rt, fr, ft, fg, frl] = await Promise.all([
      sb.from('tag_types').select('*'),
      sb.from('tags').select('*'),
      sb.from('groups').select('*'),
      sb.from('relationship_types').select('*'),
      sb.from('friends').select('*').order('name'),
      sb.from('friend_tags').select('*'),
      sb.from('friend_groups').select('*'),
      sb.from('friend_relationships').select('*'),
    ]);
    for(const r of [tt,tg,gr,rt,fr,ft,fg,frl]) if(r.error) throw r.error;
    db.tagTypes = tt.data; db.tags = tg.data; db.groups = gr.data; db.relTypes = rt.data;
    db.friends = fr.data; db.friendTags = ft.data; db.friendGroups = fg.data; db.friendRels = frl.data;
    renderFilterPanel();
    renderGrid();
  }catch(e){
    console.error(e);
    toast('데이터를 불러오지 못했어요: ' + (e.message||e));
  }
}

function tagsOfType(typeName){
  const t = db.tagTypes.find(x=>x.name===typeName);
  if(!t) return [];
  return db.tags.filter(x=>x.tag_type_id===t.id);
}
function friendTagIds(friendId){ return db.friendTags.filter(x=>x.friend_id===friendId).map(x=>x.tag_id); }
function friendGroupIds(friendId){ return db.friendGroups.filter(x=>x.friend_id===friendId).map(x=>x.group_id); }
function tagLabel(id){ const t = db.tags.find(x=>x.id===id); return t? t.label : ''; }
function groupById(id){ return db.groups.find(g=>g.id===id); }

/* ---------- Filter panel ---------- */
function renderFilterPanel(){
  const catSel = document.getElementById('categoryFilter');
  catSel.innerHTML = '<option value="">전체</option>' + tagsOfType('분류').map(t=>`<option value="${t.id}">${t.label}</option>`).join('');

  const grow = document.getElementById('groupFilterRow');
  grow.innerHTML = db.groups.map(g=>`<span class="chip" data-gid="${g.id}" style="border-color:${g.color||'var(--card-border)'}">${g.name}</span>`).join('') || '<span style="color:var(--text-faint);font-size:12px;">무리 없음</span>';
  grow.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const id=c.dataset.gid;
    filters.groupIds.has(id)?filters.groupIds.delete(id):filters.groupIds.add(id);
    c.classList.toggle('selected'); renderGrid();
  });

  const tagTypesForFilter = db.tagTypes.filter(t=>t.name!=='분류');
  const container = document.getElementById('tagFieldsContainer_filter') || document.getElementById('tagFilterGroups');
  container.innerHTML = tagTypesForFilter.map(tt=>{
    const opts = db.tags.filter(x=>x.tag_type_id===tt.id);
    if(!opts.length) return '';
    return `<div class="filter-group"><h4>${tt.name}</h4><div class="chip-row" data-tagtype="${tt.id}">${opts.map(o=>`<span class="chip" data-tid="${o.id}">${o.label}</span>`).join('')}</div></div>`;
  }).join('');
  container.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const id=c.dataset.tid;
    filters.tagIds.has(id)?filters.tagIds.delete(id):filters.tagIds.add(id);
    c.classList.toggle('selected'); renderGrid();
  });
}

/* ---------- Grid ---------- */
function applyFilters(list){
  return list.filter(f=>{
    if(filters.search && !f.name.toLowerCase().includes(filters.search.toLowerCase())) return false;
    if(filters.category && f.category_tag_id !== filters.category) return false;
    if(filters.favOnly && !f.favorite) return false;
    if(filters.minRating>0 && (f.rating||0) < filters.minRating) return false;
    if(filters.groupIds.size){
      const gids = friendGroupIds(f.id);
      if(![...filters.groupIds].every(g=>gids.includes(g))) return false;
    }
    if(filters.tagIds.size){
      const tids = friendTagIds(f.id);
      if(![...filters.tagIds].every(t=>tids.includes(t))) return false;
    }
    return true;
  });
}
function sortList(list){
  const arr = [...list];
  if(sortMode==='name') arr.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  else if(sortMode==='rating') arr.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(sortMode==='updated') arr.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));
  return arr;
}
function renderGrid(){
  const list = sortList(applyFilters(db.friends));
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  if(!list.length){ grid.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  grid.innerHTML = list.map(f=>{
    const cat = f.category_tag_id ? tagLabel(f.category_tag_id) : '';
    const tids = friendTagIds(f.id).slice(0,3).map(id=>`<span>${tagLabel(id)}</span>`).join('');
    const avatar = f.avatar_image_url ? `<img src="${f.avatar_image_url}">` : (f.avatar_emoji||'🙂');
    return `<div class="fcard" data-id="${f.id}">
      ${f.favorite?'<span class="fav">♥</span>':''}
      <div class="avatar">${avatar}</div>
      <p class="card-name">${f.name}</p>
      ${cat?`<p class="card-cat">${cat}</p>`:''}
      <div class="card-stars">${'★'.repeat(f.rating||0)}${'☆'.repeat(5-(f.rating||0))}</div>
      <div class="card-tags">${tids}</div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.fcard').forEach(c=>c.onclick=()=>openModal(c.dataset.id));
}

/* ---------- Modal ---------- */
function fillSelect(sel, options, placeholder){
  sel.innerHTML = (placeholder?`<option value="">${placeholder}</option>`:'') + options.map(o=>`<option value="${o.id}">${o.label||o.name}</option>`).join('');
}

function openModal(id){
  editingId = id;
  const f = id ? db.friends.find(x=>x.id===id) : { name:'', avatar_emoji:'🙂', rating:0, favorite:false, description:'', relationship_note:'', etc_note:'' };
  document.getElementById('modalName').value = f.name||'';
  document.getElementById('modalAvatar').innerHTML = f.avatar_image_url ? `<img src="${f.avatar_image_url}">` : (f.avatar_emoji||'🙂');
  document.getElementById('modalFav').classList.toggle('on', !!f.favorite);
  document.getElementById('modalFav').dataset.on = f.favorite? '1':'0';

  const catSel = document.getElementById('modalCategory');
  fillSelect(catSel, tagsOfType('분류'), '분류 선택 안함');
  catSel.value = f.category_tag_id || '';

  setStars('modalStars', f.rating||0);

  modalTagSelections = {};
  db.tagTypes.filter(t=>t.name!=='분류').forEach(tt=>{
    modalTagSelections[tt.id] = new Set(id? friendTagIds(id).filter(tid=>{const t=db.tags.find(x=>x.id===tid);return t&&t.tag_type_id===tt.id;}) : []);
  });
  renderTagFields();

  modalGroupSelections = new Set(id? friendGroupIds(id) : []);
  renderModalGroups();

  document.getElementById('modalDesc').value = f.description||'';
  document.getElementById('modalRelNote').value = f.relationship_note||'';
  document.getElementById('modalEtc').value = f.etc_note||'';

  const relSel = document.getElementById('relFriendSelect');
  fillSelect(relSel, db.friends.filter(x=>x.id!==id).map(x=>({id:x.id,label:x.name})), '친구 선택');
  const relTypeSel = document.getElementById('relTypeSelect');
  fillSelect(relTypeSel, db.relTypes, '유형 선택');
  renderRelList();

  document.getElementById('deleteFriendBtn').classList.toggle('hidden', !id);
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('open'); editingId=null; }

function setStars(containerId, value){
  const c = document.getElementById(containerId);
  c.dataset.value = value;
  c.querySelectorAll('span').forEach(s=>s.classList.toggle('on', +s.dataset.v<=value));
}
document.getElementById('modalStars').addEventListener('click', e=>{
  if(e.target.tagName==='SPAN') setStars('modalStars', +e.target.dataset.v);
});
document.getElementById('minRatingStars').addEventListener('click', e=>{
  if(e.target.tagName==='SPAN'){
    const v = +e.target.dataset.v;
    filters.minRating = filters.minRating===v ? 0 : v;
    setStars('minRatingStars', filters.minRating);
    renderGrid();
  }
});
document.getElementById('modalFav').onclick = ()=>{
  const b = document.getElementById('modalFav');
  const on = b.dataset.on==='1';
  b.dataset.on = on? '0':'1';
  b.classList.toggle('on', !on);
};

function renderTagFields(){
  const wrap = document.getElementById('tagFieldsContainer');
  const types = db.tagTypes.filter(t=>t.name!=='분류');
  wrap.innerHTML = types.map(tt=>{
    const opts = db.tags.filter(x=>x.tag_type_id===tt.id);
    const sel = modalTagSelections[tt.id]||new Set();
    return `<div class="field">
      <label>${tt.name}</label>
      <div class="tagpicker" data-tt="${tt.id}">
        ${opts.map(o=>`<span class="chip ${sel.has(o.id)?'selected':''}" data-tid="${o.id}">${o.label}</span>`).join('')}
      </div>
      <div class="addtag-inline"><input placeholder="새 ${tt.name} 태그" data-newtag="${tt.id}"><button data-addtagbtn="${tt.id}">추가</button></div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const tt = c.parentElement.dataset.tt; const tid = c.dataset.tid;
    if(modalTagSelections[tt].has(tid)) modalTagSelections[tt].delete(tid); else modalTagSelections[tt].add(tid);
    c.classList.toggle('selected');
  });
  wrap.querySelectorAll('[data-addtagbtn]').forEach(btn=>btn.onclick=async ()=>{
    const ttId = btn.dataset.addtagbtn;
    const input = wrap.querySelector(`[data-newtag="${ttId}"]`);
    const label = input.value.trim();
    if(!label) return;
    try{
      const {data,error} = await sb.from('tags').insert({tag_type_id:ttId, label}).select().single();
      if(error) throw error;
      db.tags.push(data);
      modalTagSelections[ttId].add(data.id);
      input.value='';
      renderTagFields(); renderFilterPanel();
      toast('태그를 추가했어요');
    }catch(e){ toast('태그 추가 실패: '+e.message); }
  });
}

function renderModalGroups(){
  const wrap = document.getElementById('modalGroups');
  wrap.innerHTML = db.groups.map(g=>`<span class="chip ${modalGroupSelections.has(g.id)?'selected':''}" data-gid="${g.id}" style="border-color:${g.color||'var(--card-border)'}">${g.name}</span>`).join('');
  wrap.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const id=c.dataset.gid;
    modalGroupSelections.has(id)?modalGroupSelections.delete(id):modalGroupSelections.add(id);
    c.classList.toggle('selected');
  });
}
document.getElementById('addGroupBtn').onclick = async ()=>{
  const input = document.getElementById('newGroupInput');
  const name = input.value.trim();
  if(!name) return;
  try{
    const colors=['#5B8CFF','#2ED9C3','#F2B93B','#FF8A5B','#C879FF','#5BD97E'];
    const color = colors[db.groups.length % colors.length];
    const {data,error} = await sb.from('groups').insert({name, color}).select().single();
    if(error) throw error;
    db.groups.push(data); modalGroupSelections.add(data.id);
    input.value=''; renderModalGroups(); renderFilterPanel();
    toast('무리를 추가했어요');
  }catch(e){ toast('무리 추가 실패: '+e.message); }
};

function renderRelList(){
  const wrap = document.getElementById('relList');
  if(!editingId){ wrap.innerHTML = '<span style="color:var(--text-faint); font-size:12px;">저장 후 관계를 추가할 수 있어요</span>'; return; }
  const rels = db.friendRels.filter(r=>r.friend_id===editingId || r.related_friend_id===editingId);
  if(!rels.length){ wrap.innerHTML = '<span style="color:var(--text-faint); font-size:12px;">등록된 관계가 없어요</span>'; return; }
  wrap.innerHTML = rels.map(r=>{
    const otherId = r.friend_id===editingId ? r.related_friend_id : r.friend_id;
    const other = db.friends.find(x=>x.id===otherId);
    const rt = db.relTypes.find(x=>x.id===r.relationship_type_id);
    return `<div class="rel-item">
      <span class="dot" style="background:${rt?.color||'#888'}"></span>
      <span class="rname">${other? other.name:'?'}</span>
      <span class="rdetail">${rt?rt.label:''}${r.detail?(' · '+r.detail):''}</span>
      <button class="rm" data-relid="${r.id}">✕</button>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.rm').forEach(b=>b.onclick=async ()=>{
    try{
      const {error} = await sb.from('friend_relationships').delete().eq('id', b.dataset.relid);
      if(error) throw error;
      db.friendRels = db.friendRels.filter(r=>r.id!==b.dataset.relid);
      renderRelList();
      toast('관계를 삭제했어요');
    }catch(e){ toast('삭제 실패: '+e.message); }
  });
}
document.getElementById('addRelTypeBtn').onclick = async ()=>{
  const input = document.getElementById('newRelTypeInput');
  const label = input.value.trim();
  if(!label) return;
  try{
    const colors=['#5B8CFF','#2ED9C3','#F2B93B','#FF8A5B','#C879FF','#5BD97E','#FF5C5C'];
    const color = colors[db.relTypes.length % colors.length];
    const {data,error} = await sb.from('relationship_types').insert({label, color}).select().single();
    if(error) throw error;
    db.relTypes.push(data);
    fillSelect(document.getElementById('relTypeSelect'), db.relTypes, '유형 선택');
    input.value=''; toast('관계 유형을 추가했어요');
  }catch(e){ toast('추가 실패: '+e.message); }
};
document.getElementById('addRelBtn').onclick = async ()=>{
  if(!editingId){ toast('먼저 저장한 뒤 관계를 추가해주세요'); return; }
  const otherId = document.getElementById('relFriendSelect').value;
  const typeId = document.getElementById('relTypeSelect').value;
  const detail = document.getElementById('relDetailInput').value.trim();
  if(!otherId || !typeId){ toast('친구와 유형을 선택해주세요'); return; }
  try{
    const {data,error} = await sb.from('friend_relationships').insert({friend_id:editingId, related_friend_id:otherId, relationship_type_id:typeId, detail:detail||null}).select().single();
    if(error) throw error;
    db.friendRels.push(data);
    document.getElementById('relDetailInput').value='';
    renderRelList();
    toast('관계를 추가했어요');
  }catch(e){ toast('관계 추가 실패: '+e.message); }
};

document.getElementById('saveFriendBtn').onclick = async ()=>{
  const name = document.getElementById('modalName').value.trim();
  if(!name){ toast('이름을 입력해주세요'); return; }
  const payload = {
    name,
    category_tag_id: document.getElementById('modalCategory').value || null,
    rating: +document.getElementById('modalStars').dataset.value || 0,
    favorite: document.getElementById('modalFav').dataset.on==='1',
    description: document.getElementById('modalDesc').value || null,
    relationship_note: document.getElementById('modalRelNote').value || null,
    etc_note: document.getElementById('modalEtc').value || null,
  };
  try{
    let friendId = editingId;
    if(editingId){
      const {error} = await sb.from('friends').update(payload).eq('id', editingId);
      if(error) throw error;
    }else{
      const {data,error} = await sb.from('friends').insert(payload).select().single();
      if(error) throw error;
      friendId = data.id; db.friends.push(data);
    }
    // sync tags
    const allTagIds = Object.values(modalTagSelections).flatMap(s=>[...s]);
    await sb.from('friend_tags').delete().eq('friend_id', friendId);
    db.friendTags = db.friendTags.filter(x=>x.friend_id!==friendId);
    if(allTagIds.length){
      const rows = allTagIds.map(tid=>({friend_id:friendId, tag_id:tid}));
      const {data,error} = await sb.from('friend_tags').insert(rows).select();
      if(error) throw error;
      db.friendTags.push(...data);
    }
    // sync groups
    await sb.from('friend_groups').delete().eq('friend_id', friendId);
    db.friendGroups = db.friendGroups.filter(x=>x.friend_id!==friendId);
    if(modalGroupSelections.size){
      const rows = [...modalGroupSelections].map(gid=>({friend_id:friendId, group_id:gid}));
      const {data,error} = await sb.from('friend_groups').insert(rows).select();
      if(error) throw error;
      db.friendGroups.push(...data);
    }
    if(editingId){
      const idx = db.friends.findIndex(x=>x.id===friendId);
      db.friends[idx] = {...db.friends[idx], ...payload};
    }
    closeModal(); renderGrid();
    toast('저장했어요');
  }catch(e){ console.error(e); toast('저장 실패: '+e.message); }
};

document.getElementById('deleteFriendBtn').onclick = async ()=>{
  if(!editingId) return;
  if(!confirm('정말 삭제할까요? 관련된 관계도 함께 삭제됩니다.')) return;
  try{
    const {error} = await sb.from('friends').delete().eq('id', editingId);
    if(error) throw error;
    db.friends = db.friends.filter(x=>x.id!==editingId);
    db.friendTags = db.friendTags.filter(x=>x.friend_id!==editingId);
    db.friendGroups = db.friendGroups.filter(x=>x.friend_id!==editingId);
    db.friendRels = db.friendRels.filter(x=>x.friend_id!==editingId && x.related_friend_id!==editingId);
    closeModal(); renderGrid();
    toast('삭제했어요');
  }catch(e){ toast('삭제 실패: '+e.message); }
};

document.getElementById('closeModalBtn').onclick = closeModal;
document.getElementById('modalBackdrop').onclick = e=>{ if(e.target.id==='modalBackdrop') closeModal(); };
document.getElementById('addFriendBtn').onclick = ()=>openModal(null);

/* ---------- Drawer / search / sort ---------- */
document.getElementById('hamburgerBtn').onclick = ()=>{
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
};
document.getElementById('drawerBackdrop').onclick = ()=>{
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
};
document.getElementById('searchInput').oninput = e=>{ filters.search = e.target.value; renderGrid(); };
document.getElementById('sortSelect').onchange = e=>{ sortMode = e.target.value; renderGrid(); };
document.getElementById('categoryFilter').onchange = e=>{ filters.category = e.target.value; renderGrid(); };
document.getElementById('favOnlyCheck').onchange = e=>{ filters.favOnly = e.target.checked; renderGrid(); };
document.getElementById('resetFiltersBtn').onclick = ()=>{
  filters = { search:'', category:'', tagIds:new Set(), groupIds:new Set(), minRating:0, favOnly:false };
  document.getElementById('searchInput').value='';
  document.getElementById('categoryFilter').value='';
  document.getElementById('favOnlyCheck').checked=false;
  setStars('minRatingStars',0);
  renderFilterPanel();
  renderGrid();
};

/* ---------- View toggle ---------- */
document.getElementById('gridViewBtn').onclick = ()=>switchView('grid');
document.getElementById('graphViewBtn').onclick = ()=>switchView('graph');
function switchView(v){
  document.getElementById('gridView').classList.toggle('hidden', v!=='grid');
  document.getElementById('graphView').classList.toggle('hidden', v!=='graph');
  document.getElementById('gridViewBtn').classList.toggle('active', v==='grid');
  document.getElementById('graphViewBtn').classList.toggle('active', v==='graph');
  if(v==='graph') initGraph();
  else if(graphState.raf) cancelAnimationFrame(graphState.raf);
}

/* ---------- Graph ---------- */
function initGraph(){
  const canvas = document.getElementById('graphCanvas');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);

  graphState.nodes = db.friends.map((f,i)=>{
    const gids = friendGroupIds(f.id);
    const g = gids.length? groupById(gids[0]) : null;
    const angle = (i/db.friends.length)*Math.PI*2;
    return { id:f.id, name:f.name, avatar:f.avatar_emoji||'🙂', color:g?g.color:'#5B8CFF',
      x: w/2 + Math.cos(angle)*Math.min(w,h)*0.3, y: h/2 + Math.sin(angle)*Math.min(w,h)*0.3,
      vx:0, vy:0 };
  });
  graphState.edges = db.friendRels.map(r=>{
    const rt = db.relTypes.find(x=>x.id===r.relationship_type_id);
    return { a:r.friend_id, b:r.related_friend_id, color: rt?rt.color:'#666', strength:r.strength||3, label: rt?rt.label:'' };
  }).filter(e=>graphState.nodes.find(n=>n.id===e.a) && graphState.nodes.find(n=>n.id===e.b));

  // legend
  const legendEl = document.getElementById('graphLegend');
  const usedTypes = [...new Set(graphState.edges.map(e=>e.label).filter(Boolean))];
  legendEl.innerHTML = usedTypes.length? ('<b>관계 유형</b>' + usedTypes.map(l=>{
    const rt = db.relTypes.find(x=>x.label===l);
    return `<div class="row"><span class="dot" style="background:${rt?.color||'#888'}"></span>${l}</div>`;
  }).join('')) : '';

  function tick(){
    const n = graphState.nodes;
    // repulsion
    for(let i=0;i<n.length;i++){
      for(let j=i+1;j<n.length;j++){
        const dx=n[j].x-n[i].x, dy=n[j].y-n[i].y;
        let dist=Math.sqrt(dx*dx+dy*dy)||1;
        const force = Math.min(2000/(dist*dist), 3);
        const fx=dx/dist*force, fy=dy/dist*force;
        n[i].vx-=fx; n[i].vy-=fy; n[j].vx+=fx; n[j].vy+=fy;
      }
      // center pull
      n[i].vx += (w/2-n[i].x)*0.001;
      n[i].vy += (h/2-n[i].y)*0.001;
    }
    // edges spring
    graphState.edges.forEach(e=>{
      const a=n.find(x=>x.id===e.a), b=n.find(x=>x.id===e.b);
      if(!a||!b) return;
      const dx=b.x-a.x, dy=b.y-a.y;
      const dist=Math.sqrt(dx*dx+dy*dy)||1;
      const target=110;
      const force=(dist-target)*0.02;
      const fx=dx/dist*force, fy=dy/dist*force;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    });
    n.forEach(node=>{
      if(graphState.dragging===node) return;
      node.vx*=0.85; node.vy*=0.85;
      node.x+=node.vx; node.y+=node.vy;
      node.x = Math.max(30, Math.min(w-30, node.x));
      node.y = Math.max(30, Math.min(h-30, node.y));
    });

    ctx.clearRect(0,0,w,h);
    graphState.edges.forEach(e=>{
      const a=n.find(x=>x.id===e.a), b=n.find(x=>x.id===e.b);
      if(!a||!b) return;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=e.color; ctx.lineWidth=Math.max(1,e.strength/1.5); ctx.globalAlpha=0.6;
      ctx.stroke(); ctx.globalAlpha=1;
    });
    n.forEach(node=>{
      ctx.beginPath(); ctx.arc(node.x,node.y,22,0,Math.PI*2);
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--card');
      ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle=node.color; ctx.stroke();
      ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(node.avatar, node.x, node.y);
      ctx.font='12px Inter, sans-serif';
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--text');
      ctx.fillText(node.name, node.x, node.y+36);
    });
    graphState.raf = requestAnimationFrame(tick);
  }
  cancelAnimationFrame(graphState.raf);
  tick();

  canvas.onmousedown = e=>{
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const hit = graphState.nodes.find(n=>Math.hypot(n.x-mx,n.y-my)<22);
    if(hit){ graphState.dragging=hit; graphState._moved=false; }
  };
  canvas.onmousemove = e=>{
    if(!graphState.dragging) return;
    graphState._moved=true;
    const rect=canvas.getBoundingClientRect();
    graphState.dragging.x = e.clientX-rect.left;
    graphState.dragging.y = e.clientY-rect.top;
    graphState.dragging.vx=0; graphState.dragging.vy=0;
  };
  window.addEventListener('mouseup', ()=>{
    if(graphState.dragging && !graphState._moved) openModal(graphState.dragging.id);
    graphState.dragging=null;
  });
}
window.addEventListener('resize', ()=>{ if(!document.getElementById('graphView').classList.contains('hidden')) initGraph(); });

loadAll();
</script>
